<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Q3 Delivery Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --top:#2c3e44; --topText:#e6eef0; --boardBg:#5b6f80; --barBg:rgba(0,0,0,.18); --barText:#ffffff;
  --col:#eceff0; --card:#ffffff; --cardHover:#f6f8f9; --text:#1e2a2e; --muted:#5f6d72; --line:#d8dee0;
  --accent:#1f6f8b; --accentSoft:#dcecf2; --good:#3d8a55; --bad:#c2413a; --badSoft:#fbe4e2; --warnSoft:#fff3d6; --warn:#9a6b00;
  --ship:#c75a4a; --plan:#3a8fb3; --process:#4f9a6a; --curse:#7b7f86; --elite:#8a55c2;
  --shadow:0 1px 0 rgba(20,40,45,.18); --shadowUp:0 10px 30px rgba(10,25,30,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --top:#141c1f; --topText:#d6e1e4; --boardBg:#25323c; --barBg:rgba(0,0,0,.25); --barText:#eef4f5;
    --col:#182023; --card:#263034; --cardHover:#2c383c; --text:#e2e9eb; --muted:#9aaab0; --line:#34404a;
    --accent:#5fb3d0; --accentSoft:#1f3a44; --good:#6cc48a; --bad:#ec6b62; --badSoft:#3d2322; --warnSoft:#3a3220; --warn:#e8c36a;
    --shadow:0 1px 0 rgba(0,0,0,.4); --shadowUp:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --top:#141c1f; --topText:#d6e1e4; --boardBg:#25323c; --barBg:rgba(0,0,0,.25); --barText:#eef4f5;
  --col:#182023; --card:#263034; --cardHover:#2c383c; --text:#e2e9eb; --muted:#9aaab0; --line:#34404a;
  --accent:#5fb3d0; --accentSoft:#1f3a44; --good:#6cc48a; --bad:#ec6b62; --badSoft:#3d2322; --warnSoft:#3a3220; --warn:#e8c36a;
  --shadow:0 1px 0 rgba(0,0,0,.4); --shadowUp:0 10px 30px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--boardBg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

.nav{background:var(--top);color:var(--topText);display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:46px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo i{width:20px;height:20px;border-radius:4px;background:var(--topText);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.logo i b{background:var(--top);border-radius:1px}
.logo i b:first-child{height:12px}.logo i b:last-child{height:7px}
.nav .mi{font-size:13px;opacity:.85}
.nav .me{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#c77d3a;color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}

.bar{background:var(--barBg);color:var(--barText);display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.bar h1{margin:0 6px 0 0;font-size:18px;font-weight:700}
.chip{background:rgba(255,255,255,.16);border-radius:4px;padding:5px 10px;font-size:13px;font-weight:500;color:var(--barText);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font-weight:700}
.chip.hp{background:rgba(255,255,255,.22)}
.chip.low{background:var(--bad);color:#fff}
.chip.st{background:rgba(255,255,255,.1)}
button.chip:hover{background:rgba(255,255,255,.28)}
.bar .sp{margin-left:auto}

.board{flex:1;display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:12px 16px 16px;min-height:0;scroll-snap-type:x proximity}
.list{flex:0 0 262px;max-height:100%;background:var(--col);border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--shadow);scroll-snap-align:start}
.list-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-weight:600}
.list-h span{color:var(--muted);font-weight:500;font-size:13px}
.cards{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:10px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;text-align:left;width:100%;display:block;border:1px solid transparent;position:relative}
.labels{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.lbt{font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:2px 6px}
.ttl{line-height:1.3;font-weight:600}
.desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.badges{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.bdg{font-size:11.5px;border-radius:4px;padding:2px 6px;background:var(--col);color:var(--muted);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.cost{background:var(--accentSoft);color:var(--accent)}
.kbd{margin-left:auto;font-size:11px;color:var(--muted)}
.play{cursor:pointer}
.play:hover{background:var(--cardHover);border-color:var(--accent)}
.play.no{opacity:.5;cursor:not-allowed}
.play.no:hover{border-color:transparent;background:var(--card)}
.addlink{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;margin:0 8px 10px;text-align:left}
.addlink:hover{background:rgba(0,0,0,.06);color:var(--text)}
.addlink.go{background:var(--accent);color:#fff}
.addlink.go:hover{filter:brightness(1.08);color:#fff}
.mute{color:var(--muted);font-size:12.5px;padding:2px 4px;line-height:1.45}
.back{background:repeating-linear-gradient(135deg,var(--card) 0 8px,var(--col) 8px 16px);height:28px;border-radius:8px;box-shadow:var(--shadow)}

/* enemy */
.enemy{padding:0;overflow:hidden}
.cover{height:40px;display:flex;align-items:flex-end;padding:6px 10px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.enemy .in{padding:8px 10px 10px}
.enemy .ttl{font-size:16px}
.hpbar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.hpbar .tr{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hpbar .tr i{display:block;height:100%;background:var(--bad);transition:width .25s}
.intent{margin-top:10px;background:var(--warnSoft);color:var(--warn);border-radius:6px;padding:6px 8px;font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.shieldb{background:var(--accentSoft);color:var(--accent)}
.statb{background:var(--badSoft);color:var(--bad)}
.float{position:absolute;right:12px;top:48px;font-weight:800;font-size:22px;color:var(--bad);animation:up .8s ease-out forwards;pointer-events:none}
.float.blk{color:var(--accent)}
@keyframes up{from{transform:translateY(6px);opacity:1}to{transform:translateY(-26px);opacity:0}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* roadmap */
.check{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.check div{display:flex;gap:8px;align-items:center;font-size:13px}
.check i{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-size:10px;font-style:normal;color:#fff}
.check .done i{background:var(--good);border-color:var(--good)}
.check .done span{text-decoration:line-through;color:var(--muted)}
.check .now span{font-weight:700}
.check .now i{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
.relic{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.relic b{display:block;font-size:13px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.log b{color:var(--text);font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.55);display:grid;place-items:start center;padding:48px 16px;z-index:40;overflow-y:auto}
.modal{background:var(--col);border-radius:12px;box-shadow:var(--shadowUp);width:min(720px,100%);padding:18px 20px 20px}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .sub{color:var(--muted);margin:0 0 14px;line-height:1.5}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.pick .card{cursor:pointer}
.pick .card:hover{border-color:var(--accent)}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border-radius:6px;padding:8px 16px;font-weight:600}
.btn.sec{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.toast{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--top);color:var(--topText);padding:10px 14px;border-radius:8px;box-shadow:var(--shadowUp);z-index:50;font-size:13px;max-width:calc(100vw - 32px)}

.decoy{display:none}
body.boss .decoy{display:flex}
body.boss .game{display:none!important}

@media (max-width:640px){.nav .mi{display:none}.list{flex-basis:80vw}.bar h1{font-size:16px;width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <nav class="nav">
    <div class="logo"><i><b></b><b></b></i>Taskwall</div>
    <span class="mi">Workspaces ⌄</span><span class="mi">Recent ⌄</span><span class="mi">Starred ⌄</span>
    <span class="me">F</span>
  </nav>
  <div class="bar" id="bar"></div>
  <div class="board game" id="board"></div>
  <div class="board decoy" id="decoy"></div>
</div>
<div class="scrim" id="scrim" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TYPE={ship:['Ship','var(--ship)'],plan:['Plan','var(--plan)'],process:['Process','var(--process)'],curse:['Revision','var(--curse)']};

/* ---------- cards ---------- */
const C={
 quickfix:{n:'Quick fix',t:'ship',c:1,dmg:6},
 boundaries:{n:'Set boundaries',t:'plan',c:1,blk:5},
 delegate:{n:'Delegate',t:'ship',c:1,dmg:5,draw:1},
 hotfix:{n:'Hotfix',t:'ship',c:2,dmg:13},
 kerning:{n:'Kerning pass',t:'ship',c:1,dmg:3,hits:3},
 prod:{n:'Push to prod',t:'ship',c:3,dmg:28},
 crunch:{n:'Crunch',t:'ship',c:0,dmg:10,self:3},
 finalfinal:{n:'final_FINAL_v2',t:'ship',c:2,perDone:2,d:'Deal 2 damage for each card in Done.'},
 decline:{n:'Decline meeting',t:'plan',c:1,blk:8},
 dnd:{n:'Do not disturb',t:'plan',c:2,blk:15},
 standup:{n:'Stand-up',t:'plan',c:1,blk:4,draw:1},
 docs:{n:'Documentation',t:'plan',c:1,blk:3,weak:2},
 coffee:{n:'Coffee',t:'process',c:0,focus:1,draw:1,ex:1},
 duck:{n:'Rubber duck',t:'process',c:1,vuln:2,draw:1},
 deep:{n:'Deep work',t:'process',c:2,str:2,ex:1},
 brainstorm:{n:'Brainstorm',t:'process',c:1,draw:3,ex:1},
 allnighter:{n:'All-nighter',t:'process',c:1,focus:2,self:5,ex:1},
 moodboard:{n:'Moodboard',t:'process',c:1,blk:6,vuln:1},
 revision:{n:'Revision',t:'curse',c:null,d:'Unplayable. Just sits in your hand looking at you.'},
};
const POOL=['hotfix','kerning','prod','crunch','finalfinal','decline','dnd','standup','docs','coffee','duck','deep','brainstorm','allnighter','moodboard','delegate'];
function cdesc(k){
  const d=C[k];if(d.d)return d.d;const p=[];
  if(d.dmg)p.push(`Deal ${d.dmg}${d.hits?` damage ${d.hits} times`:' damage'}.`);
  if(d.blk)p.push(`Gain ${d.blk} buffer.`);
  if(d.vuln)p.push(`Blocker takes 50% more damage for ${d.vuln} turn${d.vuln>1?'s':''}.`);
  if(d.weak)p.push(`Blocker hits 25% softer for ${d.weak} turns.`);
  if(d.str)p.push(`Your Ship cards deal +${d.str} damage this fight.`);
  if(d.focus)p.push(`Gain ${d.focus} focus.`);
  if(d.draw)p.push(`Draw ${d.draw} card${d.draw>1?'s':''}.`);
  if(d.self)p.push(`Lose ${d.self} morale.`);
  if(d.ex)p.push('Archive after use.');
  return p.join(' ');
}

/* ---------- blockers ---------- */
const E={
 creep:{n:'Scope Creep',hp:34,col:'#c75a4a',f:'"While you’re in there, could you just…"',m:[{atk:6},{atk:7},{str:2,blk:5}]},
 replyall:{n:'Reply-all Chain',hp:30,col:'#3a8fb3',f:'47 replies and counting. Nobody has read any of them.',m:[{atk:3,hits:3},{atk:3,hits:3},{blk:8,atk:4}]},
 deadline:{n:'Surprise Deadline',hp:44,col:'#d9a63a',f:'Moved forward to Friday. For context, it’s Thursday.',m:[{atk:12},{blk:10,dis:2},{atk:7,hits:2}]},
 pitch:{n:'The Pitch',hp:78,col:'#8a55c2',elite:1,f:'Twelve agencies. One brief. Zero budget.',m:[{atk:11},{str:3,blk:6},{atk:5,hits:3},{blk:12,atk:8}]},
 feedback:{n:'Client Feedback Round',hp:54,col:'#4f9a6a',f:'"Love it! Just a few tiny changes (attached, 38 pages)."',m:[{rev:2,atk:5},{atk:11},{atk:6,hits:2}]},
 legacy:{n:'Legacy File',hp:60,col:'#6c6f86',f:'final_FINAL_v7_USE-THIS.psd. 214 layers. None named.',m:[{blk:14},{atk:15},{atk:4,hits:4}]},
 review:{n:'Quarterly Review',hp:160,col:'#2c3e44',boss:1,f:'The numbers are in. They want to talk about them.',m:[{atk:13},{rev:1,blk:16},{str:2,atk:6,hits:2},{atk:24},{dis:2,atk:8}]},
};
const ROAD=[['fight','creep'],['fight','replyall'],['rest'],['fight','deadline'],['elite','pitch'],['rest'],['fight','feedback'],['fight','legacy'],['rest'],['boss','review']];
const RELICS={
 monitor:{n:'Second monitor',d:'Draw 1 extra card each turn.'},
 desk:{n:'Standing desk',d:'Start every fight with 8 buffer.'},
 phones:{n:'Noise-cancelling headphones',d:'+1 focus on the first turn of each fight.'},
 ball:{n:'Stress ball',d:'Recover 6 morale after every fight.'},
 espresso:{n:'Espresso machine',d:'+1 focus every turn.'},
 plant:{n:'Desk plant',d:'+12 max morale.'},
};

/* ---------- state ---------- */
let S,F=null,boss=false;
function freshRun(){
  S={hp:60,max:60,fmax:3,deck:[...Array(5).fill('quickfix'),...Array(4).fill('boundaries'),'delegate'],relics:[],node:0,phase:'relic0',log:[],wins:0};
  const st=load('ds-stats')||{runs:0,best:0,wins:0};st.runs++;save('ds-stats',st);
}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const persist=()=>save('ds-run',{S,F});
const has=r=>S.relics.includes(r);
function log(t){S.log.unshift(t);S.log=S.log.slice(0,8)}

/* ---------- fight ---------- */
function startFight(key){
  const e=E[key];
  F={e:{key,hp:e.hp,max:e.hp,blk:0,str:0,vuln:0,weak:0,turn:0},draw:shuffle(S.deck.map((k,i)=>({k,u:i+'-'+Math.random().toString(36).slice(2,6)}))),hand:[],disc:[],ex:[],focus:0,blk:has('desk')?8:0,str:0,dis:0,turn:0,fx:null};
  S.phase='fight';log(`<b>${e.n}</b> was added to Blocked`);startTurn();
}
function drawN(n){for(let i=0;i<n;i++){if(!F.draw.length){if(!F.disc.length)return;F.draw=shuffle(F.disc);F.disc=[]}if(F.hand.length>=10){F.disc.push(F.draw.pop());continue}F.hand.push(F.draw.pop())}}
function startTurn(){
  F.turn++;if(F.turn>1||!has('desk'))F.blk=F.turn>1?0:F.blk;
  F.focus=S.fmax+(has('espresso')?1:0)+(F.turn===1&&has('phones')?1:0);
  drawN(5+(has('monitor')?1:0));
  render();persist();
}
function hitEnemy(n){
  const e=F.e;let d=Math.floor(n*(F.dis>0?.75:1)*(e.vuln>0?1.5:1));
  const ab=Math.min(e.blk,d);e.blk-=ab;d-=ab;e.hp-=d;return d;
}
function play(i){
  if(!F||S.phase!=='fight'||boss)return;
  const card=F.hand[i];if(!card)return;const d=C[card.k];
  if(d.c==null){toast('Revisions can’t be played. They just clog up your hand.');return}
  if(d.c>F.focus){toast('Not enough focus. End your turn to recharge.');return}
  F.focus-=d.c;F.hand.splice(i,1);
  let total=0;
  if(d.dmg){for(let h=0;h<(d.hits||1);h++)total+=hitEnemy(d.dmg+F.str)}
  if(d.perDone)total+=hitEnemy(d.perDone*F.disc.length+F.str);
  if(d.blk)F.blk+=d.blk;
  if(d.vuln)F.e.vuln+=d.vuln;
  if(d.weak)F.e.weak+=d.weak;
  if(d.str)F.str+=d.str;
  if(d.focus)F.focus+=d.focus;
  if(d.self){S.hp-=d.self}
  (d.ex?F.ex:F.disc).push(card);
  if(d.draw)drawN(d.draw);
  F.fx=total?{t:'−'+total,k:'dmg',id:Math.random()}:(d.blk?{t:'+'+d.blk+' buffer',k:'blk',id:Math.random(),me:1}:null);
  log(`Fin moved <b>${d.n}</b> to Done${total?` · ${total} damage`:''}`);
  if(S.hp<=0)return lose();
  if(F.e.hp<=0)return winFight();
  render();persist();
}
function intentOf(){const m=E[F.e.key].m;return m[F.e.turn%m.length]}
function intentText(mv){
  const p=[];const e=F.e;
  if(mv.atk){const d=Math.floor((mv.atk+e.str)*(e.weak>0?.75:1));p.push(`Hits for ${d}${mv.hits?` × ${mv.hits}`:''}`)}
  if(mv.blk)p.push(`Stalls (+${mv.blk} block)`);
  if(mv.str)p.push(`Escalates (+${mv.str} damage)`);
  if(mv.rev)p.push(`Adds ${mv.rev} Revision${mv.rev>1?'s':''} to your Done pile`);
  if(mv.dis)p.push(`Distracts you (${mv.dis} turns)`);
  return p.join(' · ');
}
function endTurn(){
  if(!F||S.phase!=='fight'||boss)return;
  F.disc.push(...F.hand.filter(c=>C[c.k].c!=null||true));F.hand=[];
  const e=F.e,mv=intentOf();e.blk=0;
  let taken=0;
  if(mv.blk)e.blk+=mv.blk;
  if(mv.str)e.str+=mv.str;
  if(mv.rev)for(let i=0;i<mv.rev;i++)F.disc.push({k:'revision',u:'r'+Math.random()});
  if(mv.dis)F.dis+=mv.dis;
  if(mv.atk){for(let h=0;h<(mv.hits||1);h++){let d=Math.floor((mv.atk+e.str)*(e.weak>0?.75:1));const ab=Math.min(F.blk,d);F.blk-=ab;d-=ab;S.hp-=d;taken+=d}}
  e.vuln=Math.max(0,e.vuln-1);e.weak=Math.max(0,e.weak-1);F.dis=Math.max(0,F.dis-1);e.turn++;
  log(`<b>${E[e.key].n}</b>: ${intentText(mv).toLowerCase()}${taken?` · you lost ${taken} morale`:''}`);
  F.fx=taken?{t:'−'+taken+' morale',k:'dmg',id:Math.random(),me:1}:null;
  if(taken){const bb=$('bar');bb.classList.remove('shake');void bb.offsetWidth;bb.classList.add('shake')}
  if(S.hp<=0)return lose();
  startTurn();
}
function winFight(){
  const e=E[F.e.key];log(`<b>${e.n}</b> moved to Done ✓`);
  if(has('ball'))S.hp=Math.min(S.max,S.hp+6);
  const node=ROAD[S.node];F=null;
  const st=load('ds-stats')||{runs:1,best:0,wins:0};st.best=Math.max(st.best,S.node+1);
  if(node[0]==='boss'){st.wins++;save('ds-stats',st);S.phase='won';render();persist();return modalWon()}
  save('ds-stats',st);
  S.phase=node[0]==='elite'?'relic':'reward';S.offer=null;render();persist();
}
function lose(){
  const st=load('ds-stats')||{runs:1,best:0,wins:0};st.best=Math.max(st.best,S.node);save('ds-stats',st);
  S.hp=0;S.phase='over';render();persist();
}
function advance(){S.node++;S.offer=null;const n=ROAD[S.node];if(n[0]==='rest'){S.phase='rest'}else startFight(n[1]);render();persist()}

/* ---------- render: board ---------- */
function cardHTML(k,opts={}){
  const d=C[k],ty=TYPE[d.t];
  return `<div class="labels"><span class="lbt" style="background:${ty[1]}">${ty[0]}</span>${d.ex?'<span class="lbt" style="background:var(--muted)">One-off</span>':''}</div>
   <div class="ttl">${d.n}</div><div class="desc">${cdesc(k)}</div>
   <div class="badges">${d.c!=null?`<span class="bdg cost">⚡ ${d.c}</span>`:'<span class="bdg">Unplayable</span>'}${opts.kbd?`<span class="kbd">${opts.kbd}</span>`:''}</div>`;
}
function render(){
  renderBar();
  const b=$('board');
  if(!S){b.innerHTML='';return}
  const inFight=S.phase==='fight'&&F;
  // Blocked (enemy)
  let blocked='';
  if(inFight){const e=F.e,d=E[e.key],mv=intentOf();
    blocked=`<div class="card enemy" id="enemyCard"><div class="cover" style="background:${d.col}">${d.boss?'Boss':d.elite?'Elite blocker':'Blocker'}</div><div class="in">
      <div class="labels"><span class="lbt" style="background:var(--bad)">Blocked</span>${d.elite?'<span class="lbt" style="background:var(--elite)">Elite</span>':''}</div>
      <div class="ttl">${d.n}</div><div class="desc">${d.f}</div>
      <div class="hpbar"><span>☑ ${Math.max(0,e.hp)}/${e.max}</span><div class="tr"><i style="width:${Math.max(0,e.hp)/e.max*100}%"></i></div></div>
      <div class="intent">⚠ Next: ${intentText(mv)}</div>
      <div class="badges">${e.blk?`<span class="bdg shieldb">🛡 ${e.blk} block</span>`:''}${e.str?`<span class="bdg statb">▲ +${e.str} damage</span>`:''}${e.vuln?`<span class="bdg statb">Exposed ${e.vuln}</span>`:''}${e.weak?`<span class="bdg shieldb">Softened ${e.weak}</span>`:''}</div>
      </div>${F.fx&&!F.fx.me?`<span class="float" key="${F.fx.id}">${F.fx.t}</span>`:''}</div>`}
  else if(S.phase==='rest')blocked=`<div class="card"><div class="labels"><span class="lbt" style="background:var(--good)">Break</span></div><div class="ttl">Lunch break</div><div class="desc">Nothing blocked. Take five.</div></div>`;
  else blocked=`<div class="mute">Nothing blocked right now.</div>`;
  // In progress (hand)
  let hand='';
  if(inFight){
    hand=F.hand.map((c,i)=>{const d=C[c.k];const no=d.c==null||d.c>F.focus;return `<button class="card play${no?' no':''}" data-i="${i}">${cardHTML(c.k,{kbd:i<9?String(i+1):''})}</button>`}).join('')||'<div class="mute">Hand empty.</div>';
  }
  // Backlog + Done
  const drawN_=inFight?F.draw.length:S.deck.length,discN=inFight?F.disc.length:0,exN=inFight?F.ex.length:0;
  const backs=Array.from({length:Math.min(4,drawN_)},()=>'<div class="back"></div>').join('');
  const done=inFight?F.disc.slice(-5).reverse().map(c=>`<div class="card"><div class="labels"><span class="lbt" style="background:${TYPE[C[c.k].t][1]}">${TYPE[C[c.k].t][0]}</span></div><div class="ttl" style="color:var(--muted);font-weight:500">✓ ${C[c.k].n}</div></div>`).join(''):'';
  // Roadmap
  const road=ROAD.map((n,i)=>{const lab=n[0]==='rest'?'Lunch break':E[n[1]].n+(n[0]==='elite'?' (elite)':n[0]==='boss'?' (boss)':'');return `<div class="${i<S.node||(i===S.node&&['reward','relic','won'].includes(S.phase))?'done':i===S.node?'now':''}"><i>${i<S.node?'✓':''}</i><span>${lab}</span></div>`}).join('');
  const relics=S.relics.map(r=>`<div class="relic">📎<div><b>${RELICS[r].n}</b>${RELICS[r].d}</div></div>`).join('')||'<div class="mute">No power-ups yet.</div>';
  const deckList=Object.entries(S.deck.reduce((a,k)=>(a[k]=(a[k]||0)+1,a),{})).map(([k,n])=>`${C[k].n}${n>1?' ×'+n:''}`).join(', ');
  b.innerHTML=`
   <section class="list"><div class="list-h">Blocked <span>${inFight?1:0}</span></div><div class="cards">${blocked}</div></section>
   <section class="list"><div class="list-h">In progress <span>${inFight?F.hand.length:0}</span></div><div class="cards" id="hand">${hand}</div>
     ${inFight?`<button class="addlink go" id="endBtn">→ End turn <span style="margin-left:auto;font-size:11px;opacity:.8">E</span></button>`:''}</section>
   <section class="list"><div class="list-h">Backlog <span>${drawN_}</span></div><div class="cards">${backs||'<div class="mute">Empty. Done gets shuffled back in when you next draw.</div>'}<div class="mute">${inFight?'Draw pile. Cards come from here each turn.':'Your whole deck: '+deckList}</div></div></section>
   <section class="list"><div class="list-h">Done <span>${discN}${exN?' · '+exN+' archived':''}</span></div><div class="cards">${done||'<div class="mute">Played cards land here.</div>'}</div></section>
   <section class="list"><div class="list-h">Q3 Roadmap <span>${Math.min(S.node+1,ROAD.length)}/${ROAD.length}</span></div><div class="cards">
     <div class="card"><div class="labels"><span class="lbt" style="background:var(--accent)">Checklist</span></div><div class="ttl">Deliver Q3</div><div class="check">${road}</div></div>
     <div class="card"><div class="ttl">Power-ups</div>${relics}</div>
     <div class="card"><div class="ttl">Activity</div><div class="log">${S.log.map(l=>`<div>${l}</div>`).join('')||'Nothing yet.'}</div></div>
     <div class="card"><div class="ttl">Deck (${S.deck.length})</div><div class="desc">${deckList}</div></div>
   </div><button class="addlink" id="abandon">Archive board (abandon run)</button></section>`;
  b.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>play(+el.dataset.i));
  const eb=$('endBtn');if(eb)eb.onclick=endTurn;
  $('abandon').onclick=abandon;
  if(F&&F.fx&&!F.fx.me){const ec=$('enemyCard');ec&&ec.classList.add('shake')}
  if(F)F.fx=null;
  modalFor();
}
function renderBar(){
  const bar=$('bar');if(!S){bar.innerHTML='';return}
  const low=S.hp/S.max<.3;
  bar.innerHTML=`<h1>Q3 Delivery</h1><span class="chip">Sprint board</span>
   <span class="chip hp${low?' low':''} game">❤ Morale <b>${Math.max(0,S.hp)}/${S.max}</b></span>
   ${F&&S.phase==='fight'?`<span class="chip game">⚡ Focus <b>${F.focus}</b></span><span class="chip game">🛡 Buffer <b>${F.blk}</b></span>${F.str?`<span class="chip st game">▲ +${F.str} damage</span>`:''}${F.dis?`<span class="chip st game">Distracted ${F.dis}</span>`:''}`:''}
   <button class="chip sp" id="filterBtn" title="Filter (Esc)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12M4.5 8h7M7 13h2"/></svg>Filter</button>`;
  $('filterBtn').onclick=toggleBoss;
}

/* ---------- modals ---------- */
let shownFor=null;
function modal(html){$('modal').innerHTML=html;$('scrim').hidden=false}
function closeModal(){$('scrim').hidden=true}
function modalFor(){
  if(boss){closeModal();return}
  const key=S.phase+':'+S.node;
  if(['fight','won'].includes(S.phase)){if(S.phase==='fight')closeModal();return}
  if(shownFor===key&&!$('scrim').hidden)return;shownFor=key;
  if(S.phase==='relic0'||S.phase==='relic'){
    if(!S.offer)S.offer=shuffle(Object.keys(RELICS).filter(r=>!S.relics.includes(r))).slice(0,S.phase==='relic0'?3:2);
    modal(`<h2>${S.phase==='relic0'?'Welcome to Q3':'The Pitch: won'}</h2><p class="sub">${S.phase==='relic0'?'Ten cards to move to Done before the quarter ends. Kit out your desk first. Pick a power-up.':'Big win. The studio springs for something nice. Pick a power-up.'}</p>
     <div class="pick">${S.offer.map(r=>`<button class="card" data-r="${r}"><div class="labels"><span class="lbt" style="background:var(--elite)">Power-up</span></div><div class="ttl">${RELICS[r].n}</div><div class="desc">${RELICS[r].d}</div></button>`).join('')}</div>`);
    $('modal').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=b.dataset.r;S.relics.push(r);if(r==='plant'){S.max+=12;S.hp+=12}log(`Power-up: <b>${RELICS[r].n}</b>`);
      if(S.phase==='relic0'){S.offer=null;closeModal();startFight(ROAD[0][1])}else{S.phase='reward';S.offer=null;closeModal();render();persist()}});
  }
  else if(S.phase==='reward'){
    if(!S.offer)S.offer=shuffle(POOL.slice()).slice(0,3);
    modal(`<h2>Blocker cleared</h2><p class="sub">Add a card to your deck from a template, or skip to keep it lean.</p>
     <div class="pick">${S.offer.map(k=>`<button class="card" data-k="${k}">${cardHTML(k)}</button>`).join('')}</div><div class="macts"><button class="btn sec" id="skip">Skip</button></div>`);
    $('modal').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.deck.push(b.dataset.k);log(`Added <b>${C[b.dataset.k].n}</b> to the deck`);closeModal();advance()});
    $('skip').onclick=()=>{closeModal();advance()};
  }
  else if(S.phase==='rest'){
    const heal=Math.round(S.max*.3);
    modal(`<h2>Lunch break</h2><p class="sub">An actual hour, away from your desk. What’ll it be?</p>
     <div class="pick"><button class="card" id="eat"><div class="labels"><span class="lbt" style="background:var(--good)">Recover</span></div><div class="ttl">Proper lunch</div><div class="desc">Recover ${heal} morale (${S.hp}/${S.max} now).</div></button>
     <button class="card" id="trim"><div class="labels"><span class="lbt" style="background:var(--accent)">Tidy up</span></div><div class="ttl">Clear the backlog</div><div class="desc">Archive one card from your deck for good.</div></button></div>`);
    $('eat').onclick=()=>{S.hp=Math.min(S.max,S.hp+heal);log(`Lunch: +${heal} morale`);closeModal();advance()};
    $('trim').onclick=()=>{
      const uniq=[...new Set(S.deck)];
      modal(`<h2>Archive a card</h2><p class="sub">Pick one to remove from your deck.</p><div class="pick">${uniq.map(k=>`<button class="card" data-k="${k}">${cardHTML(k)}</button>`).join('')}</div><div class="macts"><button class="btn sec" id="backR">Back</button></div>`);
      $('modal').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.deck.splice(S.deck.indexOf(b.dataset.k),1);log(`Archived <b>${C[b.dataset.k].n}</b>`);closeModal();advance()});
      $('backR').onclick=()=>{shownFor=null;modalFor()};
    };
  }
  else if(S.phase==='over'){
    const st=load('ds-stats')||{};
    modal(`<h2>Burnt out</h2><p class="sub">Morale hit zero on ${S.node<ROAD.length?(ROAD[S.node][0]==='rest'?'a lunch break, somehow':E[ROAD[S.node][1]].n):'the last day'}. You got ${S.node} of ${ROAD.length} items through the roadmap.</p><p class="sub">Furthest ever: ${st.best||0}/${ROAD.length} · Quarters delivered: ${st.wins||0}</p><div class="macts"><button class="btn" id="again">Start a new quarter</button></div>`);
    $('again').onclick=newRun;
  }
}
function modalWon(){
  const st=load('ds-stats')||{};
  modal(`<h2>Quarter delivered</h2><p class="sub">The Quarterly Review has been moved to Done. Everyone clapped on the call. Some of them had their cameras on.</p><p class="sub">Morale left: ${S.hp}/${S.max} · Quarters delivered: ${st.wins||1}</p><div class="macts"><button class="btn" id="again">Start a new quarter</button></div>`);
  $('again').onclick=newRun;
}
function newRun(){closeModal();shownFor=null;F=null;freshRun();render();persist()}
let armed=false;
function abandon(){if(!armed){armed=true;toast('Click again to abandon this run.');setTimeout(()=>armed=false,3000);return}armed=false;newRun()}
let tT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,2400)}

/* ---------- disguise ---------- */
const DEC=[['To do',[['Brand review prep','plan'],['Spring campaign — print specs','ship'],['Update email templates','process']]],['In progress',[['Social cut-downs (9:16, 1:1, 4:5)','ship'],['Retouch product shots — batch 2','process']]],['Review',[['Landing page hero v2','plan'],['Motion sting — logo reveal','ship']]],['Done',[['Moodboard sign-off','process'],['Font licences renewed','plan'],['Q2 asset archive','ship']]]];
$('decoy').innerHTML=DEC.map(([n,cs])=>`<section class="list"><div class="list-h">${n} <span>${cs.length}</span></div><div class="cards">${cs.map(([t,ty],i)=>`<div class="card"><div class="labels"><span class="lbt" style="background:${['var(--ship)','var(--plan)','var(--process)'][['ship','plan','process'].indexOf(ty)]}">${['Social','Print','Web'][['ship','plan','process'].indexOf(ty)]}</span></div><div class="ttl" style="font-weight:500">${t}</div>${i===0?'<div class="badges"><span class="bdg">Due Fri</span></div>':''}</div>`).join('')}</div></section>`).join('');
function toggleBoss(){
  boss=!boss;document.body.classList.toggle('boss',boss);$('toast').hidden=true;
  if(boss)closeModal();else{shownFor=null;render()}
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();toggleBoss();return}
  if(boss||!$('scrim').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-9]$/.test(e.key)){play(+e.key-1)}
  else if(e.key==='e'||e.key==='E'){endTurn()}
});

/* ---------- boot ---------- */
const saved=load('ds-run');
if(saved&&saved.S&&saved.S.phase!=='over'&&saved.S.phase!=='won'){S=saved.S;F=saved.F;if(F)F.fx=null;render()}
else{freshRun();render();persist()}
})();
</script>

</html>
