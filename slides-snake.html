<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Q3 Brand Review – Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@500;700&display=swap">
<style>
/* Deliberately single-theme: it has to pass as a light presentation editor. */
:root{
  --bg:#f9fbfd; --chrome:#ffffff; --tool:#edf2fa; --text:#1f1f1f; --muted:#5f6368; --line:#dadce0; --canvasBg:#e8eaed;
  --yellow:#f4b400; --yellowDk:#c48f00; --sel:#1a73e8; --selSoft:#d2e3fc; --red:#d93025;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;font-size:14px;overflow:hidden;color-scheme:light;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100%}

.head{display:flex;align-items:center;gap:10px;padding:8px 16px 0}
.icon{width:30px;height:38px;border-radius:4px;background:var(--yellow);display:grid;place-items:center;flex:none}
.icon i{width:16px;height:11px;border:2px solid #fff;border-radius:2px}
.doc{font-size:18px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.doc small{font-size:12px;color:var(--muted)}
.menus{display:flex;gap:2px;font-size:14px;flex-wrap:wrap}
.menus span{padding:2px 7px}
.right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.show{border:1px solid #747775;border-radius:20px;padding:8px 16px;font-weight:500;display:flex;gap:8px;align-items:center}
.show:hover{background:#f1f3f4}
.share{background:#c2e7ff;color:#001d35;border-radius:20px;padding:9px 18px;font-weight:500}
.share:hover{background:#b3dcf5}
.me{width:32px;height:32px;border-radius:50%;background:#c77d3a;color:#fff;display:grid;place-items:center;font-weight:500}

.tools{margin:8px 16px 6px;background:var(--tool);border-radius:24px;display:flex;align-items:center;gap:2px;padding:4px 10px;overflow-x:auto;scrollbar-width:none;min-height:40px}
.tools::-webkit-scrollbar{display:none}
.t{min-width:28px;height:28px;padding:0 6px;border-radius:4px;display:inline-grid;place-items:center;color:#444746;white-space:nowrap;flex:none}
.sep{width:1px;height:20px;background:#c7c7c7;margin:0 6px;flex:none}
.tools .stat{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools .stat b{color:var(--text)}

.body{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:0}
.film{overflow-y:auto;padding:10px 12px 20px 6px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);background:var(--bg)}
.th{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start}
.th .n{font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.th .s{aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.th.on .s{border:2px solid var(--yellow);padding:7px}
.th .s i{display:block;height:4px;border-radius:2px;background:#dadce0}
.th .s i.h{height:6px;width:60%;background:#5f6368}
.th .s em{font-style:normal;font-size:8px;color:var(--muted)}
.th.new .s{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.9);opacity:.3}}

.stagecol{display:flex;flex-direction:column;min-height:0;background:var(--canvasBg)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:20px;position:relative}
canvas{display:block;background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px rgba(60,64,67,.15);max-width:100%;touch-action:none}
.notes{background:#fff;border-top:1px solid var(--line);padding:10px 16px;min-height:74px;font-size:13.5px;color:var(--muted);line-height:1.5}
.notes b{color:var(--text);font-weight:500}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;box-shadow:0 12px 32px rgba(32,33,36,.3);padding:22px 24px;width:min(380px,calc(100% - 32px));z-index:5}
.dlg h2{margin:0 0 8px;font-size:20px;font-weight:400}
.dlg p{margin:0 0 8px;color:#444746;line-height:1.5}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{background:var(--sel);color:#fff;border-radius:18px;padding:8px 20px;font-weight:500}
.btn:hover{background:#1765cc}

@media (max-width:760px){
  .body{grid-template-columns:minmax(0,1fr)}.film{display:none}
  .menus span:nth-child(n+5){display:none}.doc small,.share,.show span{display:none}
  .head{padding:8px 12px 0}.tools{margin:8px 12px 6px}.stage{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app">
  <header class="head">
    <div class="icon" aria-hidden="true"><i></i></div>
    <div>
      <div class="doc">Q3 Brand Review <span style="color:#80868b">☆</span> <small id="saved">All changes saved</small></div>
      <nav class="menus" aria-hidden="true"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Slide</span><span>Arrange</span><span>Tools</span><span>Help</span></nav>
    </div>
    <div class="right">
      <button class="show" id="showBtn" title="Slideshow (Space)"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span>Slideshow</span></button>
      <button class="share" id="shareBtn" title="Share (Esc)">Share</button>
      <span class="me">F</span>
    </div>
  </header>

  <div class="tools" aria-label="Toolbar">
    <span class="t">＋</span><span class="t">↶</span><span class="t">↷</span><span class="t">⎙</span><span class="sep"></span>
    <span class="t">⬚</span><span class="t">Aa</span><span class="t">🖼</span><span class="t">◯</span><span class="t">╱</span><span class="sep"></span>
    <span class="t">Background</span><span class="t">Layout ▾</span><span class="t">Theme</span><span class="t">Transition</span>
    <span class="stat" id="stat"></span>
  </div>

  <div class="body">
    <aside class="film" id="film"></aside>
    <section class="stagecol">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="dlg" id="dlg" hidden></div>
      </div>
      <div class="notes" id="notes"></div>
    </section>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const COLS=32,ROWS=18,PER=5;
const ITEMS=[
 {k:'bullet',n:'Bullet point',c:'#5f6368'},{k:'chart',n:'Bar chart',c:'#1a73e8'},{k:'image',n:'Stock photo',c:'#188038'},
 {k:'text',n:'Text box',c:'#9334e6'},{k:'pie',n:'Pie chart',c:'#e37400'},{k:'icon',n:'Icon',c:'#d93025'},
];
const SPECIAL={k:'comic',n:'Comic Sans',c:'#d93025'};
const GOLD={k:'anim',n:'Animation',c:'#f4b400'};

/* ---------- state ---------- */
let best=0;try{best=+localStorage.getItem('sn-best')||0}catch(e){}
let snake,dir,queue,food,extra,score,state='idle',boss=false,stepT,acc,comicT,eatenLog,cell=24,slides,newestSlide=-1;
function reset(){
  snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9},{x:5,y:9}];dir={x:1,y:0};queue=[];score=0;acc=0;comicT=0;eatenLog=[];slides=1;
  food=place(pickItem());extra=null;renderFilm();renderNotes();hud();
}
const pickItem=()=>ITEMS[Math.floor(Math.random()*ITEMS.length)];
function place(it){
  let p;do{p={x:1+Math.floor(Math.random()*(COLS-2)),y:1+Math.floor(Math.random()*(ROWS-2))}}while(snake.some(s=>s.x===p.x&&s.y===p.y)||(food&&food.x===p.x&&food.y===p.y));
  return {...p,...it,t:0};
}
const speed=()=>Math.max(55,140-slides*9)*(comicT>0?.6:1);

/* ---------- input ---------- */
function turn(x,y){
  const last=queue.length?queue[queue.length-1]:dir;
  if(last.x===-x&&last.y===-y||(last.x===x&&last.y===y))return;
  if(queue.length<3)queue.push({x,y});
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();toggleBoss();return}
  if(boss)return;
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();if(state==='play')turn(...m);else if(state!=='paused'&&k.startsWith('arrow'))start()}
  if((e.key===' '||e.key==='Enter')&&state!=='play'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();state==='paused'?resume():start()}
  if(k==='p'&&(state==='play'||state==='paused'))state==='play'?pause():resume();
});
let ts=null;
cv.addEventListener('pointerdown',e=>{ts={x:e.clientX,y:e.clientY};if(state!=='play'&&state!=='paused'&&!boss)start()});
cv.addEventListener('pointerup',e=>{if(!ts||state!=='play')return;const dx=e.clientX-ts.x,dy=e.clientY-ts.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))}ts=null});
$('showBtn').onclick=()=>{if(boss)return;state==='paused'?resume():start()};
$('shareBtn').onclick=toggleBoss;

/* ---------- flow ---------- */
function start(){reset();state='play';$('dlg').hidden=true;last=performance.now()}
function pause(){state='paused';dialog('Presentation paused','The audience is checking their phones. Carry on when you’re ready.','Resume',resume)}
function resume(){state='play';$('dlg').hidden=true;last=performance.now()}
function over(why){
  state='over';const nb=score>best;if(nb){best=score;try{localStorage.setItem('sn-best',best)}catch(e){}}
  dialog('Something went wrong',`${why} Your deck made it to <b>${slides} slide${slides>1?'s':''}</b> with ${score} item${score===1?'':'s'}.${nb&&score?' A new record deck.':' Best: '+best+'.'}`,'Present again',start);
  hud();
}
function dialog(title,html,act,fn){const d=$('dlg');d.hidden=false;d.innerHTML=`<h2>${title}</h2><p>${html}</p><div class="acts"><button class="btn" id="dBtn">${act}</button></div>`;$('dBtn').onclick=fn;$('dBtn').focus({preventScroll:true})}

function step(){
  if(queue.length)dir=queue.shift();
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS)return over('The text box slid off the slide.');
  if(snake.some((s,i)=>i<snake.length-1&&s.x===h.x&&s.y===h.y))return over('Two objects overlapped and the deck crashed.');
  snake.unshift(h);
  let grow=false;
  for(const f of [food,extra]){if(f&&f.x===h.x&&f.y===h.y){grow=true;eat(f);if(f===food)food=place(pickItem());else extra=null}}
  if(!grow)snake.pop();
}
function eat(f){
  const pts=f.k==='anim'?3:f.k==='comic'?2:1;score+=pts;
  if(f.k==='comic'){comicT=5;toastNote('Comic Sans applied to everything. Speeding up…')}
  if(f.k==='anim')toastNote('Animation added: +3 items. Everyone loves a spin transition.');
  eatenLog.push(f.n);if(eatenLog.length>8)eatenLog.shift();
  const s=1+Math.floor(score/PER);if(s>slides){slides=s;newestSlide=s;renderFilm();saving()}
  if(!extra&&Math.random()<.18)extra=place(Math.random()<.5?SPECIAL:GOLD);
  renderNotes();hud();
}
let noteMsg=null,noteT;function toastNote(t){noteMsg=t;clearTimeout(noteT);noteT=setTimeout(()=>{noteMsg=null;renderNotes()},2600);renderNotes()}
let savT;function saving(){$('saved').textContent='Saving…';clearTimeout(savT);savT=setTimeout(()=>$('saved').textContent='All changes saved',700)}

/* ---------- panels ---------- */
function renderFilm(){
  const n=boss?6:slides;
  $('film').innerHTML=Array.from({length:n},(_,i)=>`<div class="th${i===n-1?' on':''}${!boss&&i+1===newestSlide?' new':''}"><span class="n">${i+1}</span><div class="s"><i class="h"></i>${boss?['<em>Q3 Brand Review</em>','<i></i><i style="width:70%"></i>','<i></i><i></i><i style="width:40%"></i>','<i style="width:80%"></i><i></i>','<i></i><i style="width:55%"></i>','<em>Thank you</em>'][i]:'<i></i><i style="width:'+(40+((i*37)%50))+'%"></i>'}</div></div>`).join('');
  $('film').scrollTop=$('film').scrollHeight;newestSlide=-1;
}
function renderNotes(){
  if(boss){$('notes').innerHTML='Open with the headline numbers, then hand over to Priya for the campaign highlights. Keep the Q4 plan to two minutes max.';return}
  if(noteMsg){$('notes').innerHTML=`<b>${noteMsg}</b>`;return}
  if(!eatenLog.length){$('notes').textContent='Click to add speaker notes';return}
  $('notes').innerHTML=`<b>Speaker notes:</b> just added ${eatenLog.slice(-5).map(x=>x.toLowerCase()).join(', ')}. Talk over it confidently.`;
}
function hud(){$('stat').innerHTML=boss?'':`Slide <b>${slides}</b> · Items <b>${score}</b> · Best <b>${best}</b>`}

/* ---------- draw ---------- */
function fit(){
  const b=$('stage').getBoundingClientRect();const pad=b.width<700?20:40;
  cell=Math.max(8,Math.floor(Math.min((b.width-pad)/COLS,(b.height-pad)/ROWS)));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=cell*COLS+'px';cv.style.height=cell*ROWS+'px';cv.width=cell*COLS*dpr;cv.height=cell*ROWS*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawItem(f){
  const x=f.x*cell,y=f.y*cell,c=cell,m=c*.15,pulse=1+Math.sin(performance.now()/180)*.05;
  ctx.save();ctx.translate(x+c/2,y+c/2);ctx.scale(pulse,pulse);ctx.translate(-c/2,-c/2);
  ctx.fillStyle=f.c;ctx.strokeStyle=f.c;ctx.lineWidth=Math.max(1.5,c*.08);
  if(f.k==='bullet'){ctx.beginPath();ctx.arc(c*.3,c/2,c*.12,0,7);ctx.fill();ctx.fillRect(c*.5,c*.45,c*.38,c*.1)}
  else if(f.k==='chart'){[[.2,.55],[.42,.35],[.64,.2]].forEach(([bx,by])=>ctx.fillRect(c*bx,c*by,c*.16,c*(.82-by)))}
  else if(f.k==='image'){ctx.strokeRect(m,m+c*.08,c-2*m,c-2*m-c*.16);ctx.beginPath();ctx.moveTo(m,c*.75);ctx.lineTo(c*.42,c*.42);ctx.lineTo(c*.62,c*.62);ctx.lineTo(c*.72,c*.52);ctx.lineTo(c-m,c*.75);ctx.fill()}
  else if(f.k==='text'||f.k==='comic'){ctx.font=`${f.k==='comic'?'':'700 '}${c*.62}px ${f.k==='comic'?'"Comic Sans MS","Comic Sans",cursive':'Poppins,sans-serif'}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Aa',c/2,c/2+1)}
  else if(f.k==='pie'){ctx.beginPath();ctx.moveTo(c/2,c/2);ctx.arc(c/2,c/2,c*.34,-1.2,3.6);ctx.closePath();ctx.fill()}
  else if(f.k==='icon'){ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?c*.16:c*.36;ctx.lineTo(c/2+Math.cos(a)*r,c/2+Math.sin(a)*r)}ctx.closePath();ctx.fill()}
  else if(f.k==='anim'){ctx.beginPath();ctx.arc(c/2,c/2,c*.32,0,Math.PI*1.6);ctx.stroke();ctx.beginPath();ctx.moveTo(c*.82,c*.3);ctx.lineTo(c*.82,c*.52);ctx.lineTo(c*.62,c*.46);ctx.fill()}
  ctx.restore();
}
function drawLayout(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,COLS*cell,ROWS*cell);
  ctx.setLineDash([4,4]);ctx.strokeStyle='#c5c8cc';ctx.lineWidth=1;
  ctx.strokeRect(cell*2,cell*2,cell*28,cell*4);ctx.strokeRect(cell*2,cell*7,cell*28,cell*9);ctx.setLineDash([]);
  ctx.fillStyle='#b8bcc2';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`${cell*1.2}px Poppins,Arial,sans-serif`;ctx.fillText('Click to add title',cell*16,cell*4);
  ctx.font=`${cell*.8}px Roboto,Arial,sans-serif`;ctx.fillText('Click to add text',cell*16,cell*11.5);
}
function draw(){
  if(boss)return drawDecoy();
  drawLayout();
  if(!snake)return;
  [food,extra].forEach(f=>f&&drawItem(f));
  const g=cell*.12;
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],x=s.x*cell,y=s.y*cell;
    if(i===0){
      ctx.fillStyle=comicT>0?'#fde7e5':'#fff';ctx.strokeStyle=comicT>0?'#d93025':'#1a73e8';ctx.lineWidth=2;ctx.fillRect(x+1,y+1,cell-2,cell-2);ctx.strokeRect(x+1,y+1,cell-2,cell-2);
      ctx.fillStyle='#fff';ctx.lineWidth=1.3;const hs=Math.max(4,cell*.2);
      [[x,y],[x+cell,y],[x,y+cell],[x+cell,y+cell]].forEach(([hx,hy])=>{ctx.fillRect(hx-hs/2,hy-hs/2,hs,hs);ctx.strokeRect(hx-hs/2,hy-hs/2,hs,hs)});
      // rotation handle points where you're heading
      const hx=x+cell/2+dir.x*cell*.85,hy=y+cell/2+dir.y*cell*.85;ctx.beginPath();ctx.moveTo(x+cell/2+dir.x*cell/2,y+cell/2+dir.y*cell/2);ctx.lineTo(hx,hy);ctx.stroke();
      ctx.beginPath();ctx.arc(hx,hy,hs*.5,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=ctx.strokeStyle;ctx.font=`500 ${cell*.5}px Roboto,Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('T',x+cell/2,y+cell/2+1);
    }else{
      ctx.fillStyle=i%2?'#d2e3fc':'#e3edfd';ctx.strokeStyle='#8ab4f8';ctx.lineWidth=1;
      rr(x+g,y+g,cell-2*g,cell-2*g,3);ctx.fill();ctx.stroke();
      ctx.fillStyle='#8ab4f8';ctx.fillRect(x+cell*.3,y+cell*.42,cell*.4,cell*.08);ctx.fillRect(x+cell*.3,y+cell*.56,cell*.28,cell*.08);
    }
  }
}
function drawDecoy(){
  const W=COLS*cell,H=ROWS*cell;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#173039';ctx.fillRect(0,0,cell*1,H);
  ctx.fillStyle='#1f1f1f';ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font=`700 ${cell*1.3}px Poppins,Arial,sans-serif`;ctx.fillText('Q3 highlights',cell*2.5,cell*3.6);
  ctx.font=`${cell*.72}px Roboto,Arial,sans-serif`;ctx.fillStyle='#444746';
  ['Spring campaign delivered on time and on budget','Paid social conversions up 12% quarter on quarter','Brand refresh rolled out across all 40 stores','Two new retainer clients signed in August'].forEach((t,i)=>{ctx.beginPath();ctx.arc(cell*3,cell*(6.2+i*1.6)-cell*.25,cell*.14,0,7);ctx.fill();ctx.fillText(t,cell*3.6,cell*(6.2+i*1.6))});
  const bx=cell*21,by=cell*15;[[3.5,'#8ab4f8'],[5.2,'#8ab4f8'],[6.1,'#8ab4f8'],[8.4,'#1a73e8']].forEach(([h,c],i)=>{ctx.fillStyle=c;ctx.fillRect(bx+i*cell*2.2,by-h*cell,cell*1.5,h*cell)});
  ctx.fillStyle='#5f6368';ctx.font=`${cell*.5}px Roboto,Arial`;['Q4','Q1','Q2','Q3'].forEach((q,i)=>ctx.fillText(q,bx+i*cell*2.2+cell*.35,by+cell*.8));
}
function toggleBoss(){
  boss=!boss;
  if(boss){if(state==='play')state='held';$('dlg').dataset.v=$('dlg').hidden?'':'1';$('dlg').hidden=true}
  else{if(state==='held')pause();else if($('dlg').dataset.v)$('dlg').hidden=false}
  renderFilm();renderNotes();hud();draw();
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(t){
  const dt=t-last;last=t;
  if(state==='play'&&!boss&&!document.hidden){acc+=dt;if(comicT>0)comicT-=dt/1000;
    while(acc>=speed()&&state==='play'){acc-=speed();step()}}
  draw();requestAnimationFrame(frame);
}
addEventListener('resize',fit);
reset();fit();requestAnimationFrame(frame);
dialog('Build the deck','Steer the text box around the slide and grab bullet points, charts and photos. Every 5 items adds a slide. Don’t hit the edge or overlap yourself. Watch out for Comic Sans. Arrow keys or WASD, swipe on a phone, P to pause, Esc to hide.','Start slideshow',start);
})();
</script>

</html>
