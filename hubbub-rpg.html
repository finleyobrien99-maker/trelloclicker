<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Studio Ops – Hubbub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
:root{
  --side:#1c2433; --side2:#232d40; --sideText:#b7c1d3; --sideHi:#ffffff; --sideAct:#d9932b; --sideActText:#1c2433;
  --bg:#ffffff; --bg2:#f6f7f9; --text:#1d2129; --muted:#646c79; --line:#e4e7ec; --hover:#f3f4f7;
  --accent:#b76e14; --accentSoft:#fbf0de; --link:#1f6fb2; --good:#2a7d46; --bad:#c0392b; --chip:#ffffff;
  --narr:#fbfaf6; --mention:#fdf3dd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side:#121822; --side2:#18202c; --sideText:#9aa6b8; --sideAct:#e0a449;
    --bg:#1b1f26; --bg2:#20252d; --text:#e4e8ee; --muted:#9aa3b1; --line:#2d333d; --hover:#232932;
    --accent:#e8a64f; --accentSoft:#3a2e1c; --link:#74b3e6; --good:#6fcf8f; --bad:#f08a7e; --chip:#232932;
    --narr:#1f242c; --mention:#3a321f;
  }
}
:root[data-theme="dark"]{
  --side:#121822; --side2:#18202c; --sideText:#9aa6b8; --sideAct:#e0a449;
  --bg:#1b1f26; --bg2:#20252d; --text:#e4e8ee; --muted:#9aa3b1; --line:#2d333d; --hover:#232932;
  --accent:#e8a64f; --accentSoft:#3a2e1c; --link:#74b3e6; --good:#6fcf8f; --bad:#f08a7e; --chip:#232932;
  --narr:#1f242c; --mention:#3a321f;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:62px 250px minmax(0,1fr) 300px;height:100%}

.rail{background:var(--side);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.ws{width:38px;height:38px;border-radius:10px;background:var(--sideAct);color:var(--sideActText);font-weight:800;display:grid;place-items:center;font-size:14px}
.rail .ri{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--sideText)}
.side{background:var(--side2);color:var(--sideText);display:flex;flex-direction:column;min-height:0}
.side-h{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
.side-h b{color:var(--sideHi);font-size:16px;font-weight:800}
.side-h small{display:block;font-size:12px;color:var(--sideText);font-weight:400}
.sb{overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:16px}
.sb h4{margin:0 8px 6px;font-size:12px;font-weight:600;opacity:.75}
.ch{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;text-align:left;color:var(--sideText)}
.ch:hover{background:rgba(255,255,255,.06)}
.ch.on{background:var(--sideAct);color:var(--sideActText);font-weight:700}
.ch.near{color:var(--sideHi)}
.ch.far{opacity:.55}
.ch .h{width:14px;opacity:.75;text-align:center}
.ch .tag{margin-left:auto;font-size:11px;opacity:.75}
.ch .dot{width:8px;height:8px;border-radius:50%;background:#4fb676;flex:none;margin:0 3px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);min-height:56px}
.top h2{margin:0;font-size:17px;font-weight:800;white-space:nowrap}
.top .topic{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt{min-width:0;display:flex;flex-direction:column}
.menu{display:none;padding:6px;border-radius:6px}
.top .right{margin-left:auto;display:flex;gap:6px;flex:none}
.tb{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted);background:var(--bg)}
.tb:hover{color:var(--text)}
.feed{flex:1;overflow-y:auto;padding:12px 0 6px}
.day{display:flex;align-items:center;gap:10px;margin:8px 18px;color:var(--muted);font-size:12px;font-weight:700}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:6px 18px}
.msg:hover{background:var(--hover)}
.msg.narr{background:var(--narr)}
.msg.narr:hover{background:var(--hover)}
.msg.cont{padding-top:0}
.msg.cont .av{visibility:hidden;height:0}
.msg.cont .who{display:none}
.av{width:36px;height:36px;border-radius:8px;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who b{font-weight:800}
.who .tag{font-size:10px;font-weight:700;background:var(--line);color:var(--muted);border-radius:3px;padding:1px 4px}
.who time{color:var(--muted);font-size:12px}
.txt{line-height:1.5;overflow-wrap:anywhere}
.txt p{margin:0 0 6px}.txt p:last-child{margin:0}
.txt em{color:var(--muted)}
.txt .it{font-weight:700;color:var(--accent)}
.txt .pp{font-weight:700;color:var(--link)}
.txt .ex{font-weight:700;color:var(--good)}
.txt .dmg{font-weight:800;color:var(--bad)}
.txt code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act{border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600}
.act:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.act:disabled{opacity:.45;cursor:default}
.act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hpbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
.hpbar .tr{width:140px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.hpbar .tr i{display:block;height:100%;background:var(--bad);transition:width .25s}
.card{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 12px;margin-top:6px;background:var(--bg)}

.chips{display:flex;gap:6px;padding:0 18px 8px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:4px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.go{color:var(--good)}.chip.pp{color:var(--link)}.chip.fight{color:var(--bad)}
.compose{padding:0 18px 14px}
.box{border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px}
.box:focus-within{border-color:var(--muted)}
.box input{flex:1;border:0;background:none;color:var(--text);font:inherit;padding:6px 0;min-width:0}
.box input:focus{outline:none}
.send{background:var(--accent);color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;font-size:13px}

.panel{border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.me{display:flex;gap:12px;align-items:center}
.me .av{width:48px;height:48px;border-radius:12px;font-size:18px}
.me b{display:block;font-size:17px}
.me span{font-size:13px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.stat .l{display:flex;justify-content:space-between;font-size:13px}
.stat .l span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.meter.low i{background:var(--bad)}
.meter.time i{background:var(--accent)}
.inv{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .ic{width:30px;height:30px;border-radius:6px;background:var(--accentSoft);display:grid;place-items:center;font-size:15px}
.item b{font-size:13.5px;display:block}
.item small{font-size:12px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.q b{font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.q b small{font-weight:600;color:var(--muted);font-size:11px}
.q.done{opacity:.6}
.q ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.q li{display:grid;grid-template-columns:16px 1fr;gap:4px;color:var(--muted)}
.q li.ok{color:var(--text)}
.q li::before{content:"○"}
.q li.ok::before{content:"✓";color:var(--good);font-weight:800}

/* disguise */
.decoy-only{display:none!important}
body.boss .decoy-only{display:revert!important}
body.boss .game-only{display:none!important}
body.boss #decoy{display:block!important}
body.boss #feed{display:none!important}
.dp h3{margin:0 0 8px}
.dp p{margin:0 0 8px;font-size:14px;line-height:1.5}

@media (max-width:1180px){.app{grid-template-columns:62px 230px minmax(0,1fr)}.panel{position:fixed;right:0;top:0;bottom:0;width:min(320px,90vw);z-index:25;transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 30px rgba(0,0,0,.2)}.panel.open{transform:none}}
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,84vw);z-index:26;transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}.menu{display:block}
  .msg{padding:6px 12px}.chips,.compose{padding-left:12px;padding-right:12px}.day{margin-inline:12px}.top{padding:8px 12px}
  .top .tb span{display:none}
}
.scrim{display:none}
.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:24}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="rail" aria-hidden="true">
    <span class="ws">SO</span>
    <span class="ri"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h14v10H8l-5 3z"/></svg></span>
    <span class="ri"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3a5 5 0 0 0-5 5v3l-2 3h14l-2-3V8a5 5 0 0 0-5-5z"/></svg></span>
  </nav>

  <aside class="side" id="side">
    <div class="side-h"><div><b>Studio Ops</b><small id="sideClock">Tuesday · 09:00</small></div><span>⌄</span></div>
    <div class="sb">
      <div><h4>Channels</h4><div id="chans"></div></div>
      <div><h4>Direct messages</h4><div id="dms"></div></div>
      <div class="game-only"><h4>Apps</h4>
        <button class="ch" id="appInv"><span class="h">▤</span>Inventory</button>
        <button class="ch" id="appQuest"><span class="h">✓</span>Quest log</button>
        <button class="ch" id="appHelp"><span class="h">?</span>Help</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Channels"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
      <div class="tt"><h2 id="chName"># reception</h2><div class="topic" id="chTopic"></div></div>
      <div class="right">
        <button class="tb game-only" id="panelBtn" title="Details">ⓘ <span>Details</span></button>
        <button class="tb" id="hideBtn" title="Huddle (Esc)">🎧 <span>Huddle</span></button>
      </div>
    </header>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="feed" id="decoy" style="display:none"></div>
    <div class="chips game-only" id="chips"></div>
    <div class="compose">
      <form class="box" id="form" autocomplete="off">
        <input id="input" aria-label="Message" placeholder="Message #reception">
        <button class="send" type="submit">Send</button>
      </form>
    </div>
  </main>

  <aside class="panel" id="panel">
    <div class="game-only">
      <h3>You</h3>
      <div class="me"><span class="av" style="background:#c77d3a">F</span><div><b>Fin</b><span id="meTitle">Designer · on a deadline</span></div></div>
      <div class="stat"><div class="l"><span>Energy</span><span id="sEnergy">30 / 30</span></div><div class="meter" id="mEnergy"><i style="width:100%"></i></div></div>
      <div class="stat"><div class="l"><span>Time until 17:30</span><span id="sTime">8h 30m</span></div><div class="meter time" id="mTime"><i style="width:100%"></i></div></div>
      <div class="stat"><div class="l"><span>Reputation</span><span id="sRep">0</span></div></div>
    </div>
    <div class="game-only"><h3>Inventory <span id="invCount">0</span></h3><div class="inv" id="inv"></div></div>
    <div class="game-only"><h3>Quests</h3><div id="quests"></div></div>
    <div class="decoy-only dp"><h3>About #general</h3><p>Company-wide announcements and work-based matters.</p><p style="color:var(--muted)">14 members · Created March 2021</p></div>
  </aside>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>s.toLowerCase().replace(/[^a-z0-9#' ]+/g,' ').replace(/\s+/g,' ').trim();
const DEADLINE=510; // minutes after 09:00 = 17:30

/* =========================================================
   WORLD
   ========================================================= */
const I=n=>`<span class="it">${n}</span>`, P=n=>`<span class="pp">${n}</span>`, X=n=>`<span class="ex">#${n}</span>`;
const ITEMS={
 biscuit:{n:'digestive biscuit',ic:'🍪',al:['biscuit','digestive'],x:'A slightly soft digestive. Somebody, somewhere, would be very grateful for this.'},
 tupperware:{n:'tupperware',ic:'🥡',al:['tupperware','box','lunch'],x:'Masking tape on the lid: “PROPERTY OF JANET. DO NOT EAT. I MEAN IT.” There’s a lasagne inside with one bite missing.'},
 key:{n:'cupboard key',ic:'🗝️',al:['key','cupboard key'],x:'A small brass key on a keyring shaped like a stapler.'},
 descaler:{n:'descaler',ic:'🧴',al:['descaler','descaling'],x:'Coffee machine descaler. “Use every 3 months.” Last used: 2019.'},
 toner:{n:'toner cartridge',ic:'🖨️',al:['toner','cartridge'],x:'A black toner cartridge. Heavier than it has any right to be.'},
 stapler:{n:'red stapler',ic:'📎',al:['stapler','red stapler'],weapon:2,x:'A heavy red stapler with “TOM” scratched into the base. Surprisingly good in a fight (+2 damage).'},
 umbrella:{n:'golf umbrella',ic:'☂️',al:['umbrella','brolly'],x:'Enormous. Branded with a company that went bust in 2011. Keeps the rain off.'},
 badge:{n:'facilities badge',ic:'🪪',al:['badge','facilities badge','lanyard'],x:'“M. PRYCE — FACILITIES — ALL AREAS”. The photo is of a man who has seen things.'},
 usb:{n:'USB stick',ic:'💾',al:['usb','stick','usb stick','memory stick'],x:'A chunky USB stick with “DAN — IT — DO NOT WIPE” on it. Slightly chewed.'},
 usbfile:{n:'USB stick (with final file)',ic:'💾',al:['usb','stick','usb stick','file','final file','artwork'],x:'Dan’s USB stick, now holding <code>final_FINAL_v7_USE-THIS.psd</code>. 2.4 GB of hope.'},
 keycard:{n:'server room keycard',ic:'💳',al:['keycard','card','key card'],x:'A white keycard. Opens the server room. Dan made you promise not to touch “the blinky one”.'},
 flatwhite:{n:'flat white',ic:'☕',al:['coffee','flat white','flatwhite'],food:14,x:'A proper flat white from the newly descaled machine. Drink it for energy, or give it to someone who deserves it.'},
 proofs:{n:'printed proofs',ic:'📄',al:['proofs','proof','prints','printouts'],x:'Crisp colour proofs of the spring campaign. Still warm. The logo is, in fact, big enough.'},
 signed:{n:'signed-off proofs',ic:'✅',al:['proofs','signed proofs','signed','sign off'],x:'The proofs, with “APPROVED — HW” scrawled across the top in green pen. The holy grail.'},
 laser:{n:'laser pointer',ic:'🔴',al:['laser','pointer','laser pointer'],weapon:1,x:'A laser pointer from Meeting Room B. Surprisingly effective at distracting things (+1 damage).'},
 headphones:{n:'noise-cancelling headphones',ic:'🎧',al:['headphones','cans'],def:2,x:'Tom’s spare noise-cancelling headphones. Everything hurts a bit less (take 2 less damage).'},
 golden:{n:'golden stapler',ic:'🏆',al:['golden stapler','gold stapler','golden','gold'],weapon:4,x:'A stapler cast in gold, awarded for “Services to Stationery, 1998”. Devastating (+4 damage).'},
 mute:{n:'mute button',ic:'🔇',al:['mute','mute button'],x:'A big red button labelled MUTE. In a fight, it silences an enemy for a turn. Works once per fight.'},
 award:{n:'dusty award',ic:'🏅',al:['award','trophy'],x:'“BEST USE OF CLIP ART — 2004”. Priya would find this hilarious.'},
};
const LOCS={
 reception:{n:'reception',topic:'Front desk, visitors, and a sofa nobody sits on',exits:['kitchen','studio','lift','carpark'],
  d:s=>`The reception of Studio Ops. A sad pot plant, a sofa nobody sits on, and a ${I('lost & found box')} under the desk. ${s.npcHere('janet')?P('Janet')+' is behind the front desk, glaring at the fridge through the kitchen door.':''}`,
  things:{lostfound:{n:'lost & found box',al:['lost','found','box','lost and found','lost & found'],x:s=>s.f.lfOpened?'Empty now, apart from a single odd sock.':'A cardboard box full of other people’s things. You could open it.'},
   plant:{n:'pot plant',al:['plant','pot plant'],x:'A peace lily in its final act. Someone has watered it with cold brew.'},
   sofa:{n:'sofa',al:['sofa','couch'],x:'Grey, firm, slightly damp. Perfect for a lie down if you run out of energy.'}}},
 kitchen:{n:'kitchen',topic:'Please wash your own mugs (this means YOU)',exits:['reception','cupboard'],
  d:s=>`The office kitchen. A ${I('coffee machine')} ${s.f.descaled?'hums happily, freshly descaled':'blinks a red DESCALE light at you'}. There’s a ${I('fridge')}, a ${I('biscuit tin')}, and the door to the ${X('stationery-cupboard')}${s.f.cupboard?'':' (locked)'}.`,
  things:{machine:{n:'coffee machine',al:['coffee machine','machine','coffee'],x:s=>{s.startQ('coffee');return s.f.descaled?'Clean, shiny and ready. You could make coffee.':'The DESCALE light is flashing. It dispenses one sad drip of brown water and gives up. It needs descaler.'}},
   fridge:{n:'fridge',al:['fridge'],x:s=>s.f.tupTaken?'Six half-empty milks and a yoghurt from last March.':'Six half-empty milks, a yoghurt from last March, and a '+I('tupperware')+' with someone’s name on it.'},
   tin:{n:'biscuit tin',al:['tin','biscuit tin','biscuits'],x:'A Christmas biscuit tin. It is September. There are still digestives in it. You could take a biscuit.'}}},
 cupboard:{n:'stationery-cupboard',topic:'Authorised personnel only (Janet)',exits:['kitchen'],lock:s=>(s.f.cupboard||s.has('key'))?null:'The stationery cupboard is locked. Janet has the key, and Janet doesn’t give the key to just anyone.',
  d:s=>`A cupboard that smells of toner and ambition. Shelves of envelopes, a pallet of A4, ${s.f.descTaken?'':'a bottle of '+I('descaler')+', '}${s.f.tonerTaken?'':'a boxed '+I('toner cartridge')+', '}${s.f.stapTaken?'':'and, on the top shelf, a '+I('red stapler')+' with a name scratched on it'}.`,
  things:{shelves:{n:'shelves',al:['shelves','shelf','paper','envelopes'],x:'Enough envelopes to last until the heat death of the universe.'}}},
 studio:{n:'studio',topic:'Where the magic happens (and the deadlines)',exits:['reception','print','meeting'],
  d:s=>`The studio floor. Big monitors, bigger plants, and your ${I('desk')}. ${s.npcHere('priya')?P('Priya')+' is pacing by the window with a phone to her ear. ':''}${s.npcHere('tom')?P('Tom')+' is staring at his desk, where a stapler used to be.':''} Doors lead to the ${X('print-room')} and ${X('meeting-room-b')}.`,
  things:{desk:{n:'your desk',al:['desk','my desk','computer','monitor'],x:s=>s.f.won?'Tidy, for once.':'Your monitor shows a missing-file icon where the spring campaign should be. The final file lives on the server.'}}},
 print:{n:'print-room',topic:'Printer status: angry',exits:['studio'],
  d:s=>`A windowless room humming with menace. The big colour ${I('printer')} ${s.f.toner?'has fresh toner and a look in its eye':'flashes TONER EMPTY'}. ${s.f.gremlin?'':'Something rustles inside the paper tray.'}`,

const hhmm=m=>{const t=9*60+m;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function post(ch,who,html,actions){
  const f=S.feeds[ch]||(S.feeds[ch]=[]);
  const last=f[f.length-1];const cont=last&&last.who===who&&!actions&&!last.actions;
  const m={id:S.uid++,who,html,actions,t:hhmm(S.time),cont};if(who==='enemy')m.en=S.combat?S.combat.name:(last&&last.en)||'Enemy';f.push(m);if(f.length>160)f.splice(0,f.length-160);
  if(ch===S.view&&!boss){$('feed').appendChild(msgEl(m));scrollDown()}
  return m;
}
const say=(html,actions)=>post(S.view,'narr',html,actions);

function whoInfo(w,m){
  if(w==='narr')return {n:'Hubbub',ini:'H',col:'#3b4a63',bot:1};

}
function msgEl(m){

  return d;

function renderFeed(){

   ========================================================= */
function matchIn(list,q){ // list: [{id,names}]
  q=norm(q);if(!q)return null;
  let best=null,bs=0;
  for(const o of list)for(const n of o.names){const nn=norm(n);let sc=0;
    if(q===nn)sc=1000+nn.length;else if(q.includes(nn))sc=500+nn.length;else if(nn.includes(q)&&q.length>2)sc=q.length;
    if(sc>bs){best=o;bs=sc}}
  return best;
}
const invList=()=>S.inv.map(id=>({id,names:[ITEMS[id].n,...ITEMS[id].al]}));
const thingList=()=>Object.entries(LOCS[S.loc].things||{}).map(([id,t])=>({id,names:[t.n,...t.al]}));
const npcList=()=>npcsAt(S.loc).map(id=>({id,names:[NPCS[id].n,...(NPCS[id].al||[])]}));
const exitList=()=>(S.combat?[]:LOCS[S.loc].exits).map(id=>({id,names:[LOCS[id].n,LOCS[id].n.replace(/-/g,' '),id,'#'+LOCS[id].n]}));

function run(raw,echo=true){
  if(S.over&&!/^(restart|new game)/.test(norm(raw))){say('The day is over. Type <code>restart</code> or use the button to start again.');return}
  const c=norm(raw);if(!c)return;
  if(echo)post(S.view,'you',esc(raw));
  const [v,...rest]=c.split(' ');const r=rest.join(' ');
  if(S.combat&&!['i','inventory','q','quests','help','look','l','examine','x'].includes(v))return combatCmd(v,r);
  switch(v){
   case 'l':case 'look':return r?examine(r):look();
   case 'x':case 'examine':case 'inspect':case 'check':case 'read':return examine(r);
   case 'go':case 'walk':case 'enter':case 'visit':return go(r.replace(/^to /,''));
   case 'back':return go(S.prev);
   case 'take':case 'get':case 'grab':case 'pick':return take(r.replace(/^up /,''));
   case 'drop':return drop(r);
   case 'open':return open(r);
   case 'use':case 'put':case 'insert':case 'load':return use(r);
   case 'give':case 'hand':case 'offer':case 'show':return give(r);
   case 'talk':case 'speak':case 'chat':case 'ask':return talk(r.replace(/^(to|with) /,''));
   case 'say':case 'shout':case 'post':case 'reply':return sayCmd(r);
   case 'drink':case 'eat':return use(r);
   case 'make':case 'brew':return /coffee|flat/.test(r)?makeCoffee():say('You can’t make that here.');
   case 'print':return printCmd();
   case 'i':case 'inv':case 'inventory':return inventory();
   case 'q':case 'quests':case 'quest':case 'journal':return questsCmd();
   case 'wait':case 'rest':case 'sleep':return wait();
   case 'help':case 'h':case '?':return help();
   case 'restart':return restart();
   case 'attack':case 'hit':case 'fight':return say('There’s nothing to fight here. Probably for the best.');
   case 'hug':case 'pet':case 'stroke':return npcsAt(S.loc).includes('dog')?(say(`${P('Biscuit')} leans into it. He does not, however, move off the shiny thing.`),tick(5)):say('Best not.');
  }
  // bare exit / channel name
  const ex=matchIn(exitList(),c);if(ex)return go(ex.id);
  const th=matchIn(thingList(),c)||matchIn(invList(),c);if(th)return examine(c);
  say(`Hubbub didn’t understand <code>${esc(raw)}</code>. Try <code>look</code>, <code>go studio</code>, <code>take biscuit</code>, <code>use toner on printer</code>, <code>give tupperware to janet</code> or <code>talk to priya</code>. <code>help</code> lists everything.`);
}

function tick(m){
  S.time+=m;
  if(!S.f.won&&S.time>=DEADLINE&&!S.over){S.time=DEADLINE;endGame(false)}
}
function look(){
  const L=LOCS[S.loc];
  const ppl=npcsAt(S.loc).filter(n=>n!=='mark'||S.f.meetingDone);
  const acts=[];
  L.exits.forEach(e=>acts.push(['→ #'+LOCS[e].n,'go '+LOCS[e].n]));
  say(`<p>${L.d(api)}</p>`+(S.dropped&&S.dropped[S.loc]&&S.dropped[S.loc].length?`<p>On the floor: ${S.dropped[S.loc].map(i=>I(ITEMS[i].n)).join(', ')}.</p>`:''),acts.length?acts:null);
}
function go(q){
  if(S.combat)return say('You can’t just leave in the middle of this. Try <code>flee</code>.');
  let id=typeof q==='string'&&LOCS[q]?q:null;
  if(!id){const m=matchIn(Object.keys(LOCS).map(k=>({id:k,names:[LOCS[k].n,LOCS[k].n.replace(/-/g,' '),k,'#'+LOCS[k].n]})),q);id=m&&m.id}
  if(!id)return say(`Go where? Exits: ${LOCS[S.loc].exits.map(e=>X(LOCS[e].n)).join(', ')}.`);
  if(id===S.loc){say('You’re already here.');return}
  if(S.loc==='meeting'&&!S.f.meetingDone)return meetingBlock();
  if(id!=='general'&&S.loc!=='general'&&!LOCS[S.loc].exits.includes(id)){return say(`You can’t get to ${X(LOCS[id].n)} from here. Exits: ${LOCS[S.loc].exits.map(e=>X(LOCS[e].n)).join(', ')}.`)}
  if(S.loc==='general'&&id!=='general'&&id!==S.prev&&!LOCS[S.prev].exits.includes(id)&&id!==S.prev){return say(`You close #general and head back to ${X(LOCS[S.prev].n)} first.`),travel(S.prev)}
  const lock=LOCS[id].lock&&LOCS[id].lock(api);if(lock)return say(lock);
  travel(id);
}
function travel(id){
  const was=S.loc;S.prev=S.loc===('general')?S.prev:S.loc;S.loc=id;S.view=id;
  if(!S.known.includes(id))S.known.push(id);
  LOCS[id].exits.forEach(e=>{if(!S.known.includes(e))S.known.push(e)});
  tick(5);renderAll();
  const first=!(S.feeds[id]&&S.feeds[id].length);
  if(first)post(id,'day','Today');
  arrive(id,first);
  save();
}
function arrive(id,first){
  look();
  if(id==='carpark'&&api.has('umbrella'))say('<em>You shelter under the golf umbrella. Smug and dry.</em>');
  if(id==='carpark'){ if(!api.has('umbrella')){S.energy-=5;say('<span class="dmg">−5 energy.</span> You’re soaked to the bone. An umbrella would help.');checkEnergy()} }
  if(id==='server'){S.energy-=2;say('It’s roasting in here. <span class="dmg">−2 energy.</span>');checkEnergy()}
  if(id==='meeting'&&!S.f.meetingDone){startQ('meeting');npcSay('mark','Fin! Perfect timing. Grab a seat, we’re aligning on alignment. Shouldn’t be more than… a couple of hours?',[['Nod along','say nod along'],['“Let’s take this offline”','say let’s take this offline',1],['Try to leave','go studio']])}
  if(id==='general'&&!S.f.wraith)startWraith();
  if(id==='archive'&&!S.f.ghost&&first){startQ('ghost');ghostRiddle()}
  if(id==='print'&&first&&!S.f.toner)say('<em>Hint: the printer needs toner. The stationery cupboard off the kitchen probably has some.</em>');
}
function examine(q){
  if(!q)return look();
  const it=matchIn(invList(),q);
  if(it)return say(`${ITEMS[it.id].ic} <b>${ITEMS[it.id].n}</b>: ${ITEMS[it.id].x}`);
  const th=matchIn(thingList(),q);
  if(th){const t=LOCS[S.loc].things[th.id];tick(0);return say(typeof t.x==='function'?t.x(api):t.x)}
  const np=matchIn(npcList(),q);if(np)return say(`${P(NPCS[np.id].n)}, ${NPCS[np.id].title}. Try <code>talk to ${NPCS[np.id].n.toLowerCase()}</code>.`);
  const fl=S.dropped&&S.dropped[S.loc]&&matchIn(S.dropped[S.loc].map(id=>({id,names:[ITEMS[id].n,...ITEMS[id].al]})),q);
  if(fl)return say(ITEMS[fl.id].x);
  say('You don’t see that here.');
}
function giveItem(id,silent){if(!S.inv.includes(id))S.inv.push(id);if(!silent)say(`${ITEMS[id].ic} You got the ${I(ITEMS[id].n)}.`);renderPanel()}
const lose=id=>{S.inv=S.inv.filter(x=>x!==id);renderPanel()};
function take(q){
  const L=S.loc,c=norm(q);
  const fl=S.dropped&&S.dropped[L]&&matchIn(S.dropped[L].map(id=>({id,names:[ITEMS[id].n,...ITEMS[id].al]})),c);
  if(fl){S.dropped[L]=S.dropped[L].filter(x=>x!==fl.id);giveItem(fl.id);return tick(5)}
  const T=[
   [L==='kitchen'&&/biscuit|digestive/.test(c),()=>{if(api.has('biscuit'))return say('You’ve already got a biscuit. Don’t be greedy.');giveItem('biscuit')}],
   [L==='kitchen'&&/tupperware|lasagne|box/.test(c),()=>{if(S.f.tupTaken)return say('It’s gone.');S.f.tupTaken=1;giveItem('tupperware');if(!S.q.tup)say('<em>Somebody is going to want this back.</em>')}],
   [L==='cupboard'&&/descal/.test(c),()=>{if(S.f.descTaken)return say('Already taken.');S.f.descTaken=1;giveItem('descaler');startQ('coffee')}],
   [L==='cupboard'&&/toner|cartridge/.test(c),()=>{if(S.f.tonerTaken)return say('Already taken.');S.f.tonerTaken=1;giveItem('toner')}],
   [L==='cupboard'&&/stapler/.test(c),()=>{if(S.f.stapTaken)return say('Already taken.');S.f.stapTaken=1;giveItem('stapler')}],
   [L==='meeting'&&/laser|pointer/.test(c),()=>{if(!S.f.meetingDone)return npcSay('mark','Ah-ah, I’m using that. Sit down, we’re nearly on slide 4.');if(S.f.laserTaken)return say('Already taken.');S.f.laserTaken=1;giveItem('laser')}],
   [L==='archive'&&/award|trophy/.test(c),()=>{if(S.f.awardTaken)return say('Already taken.');S.f.awardTaken=1;giveItem('award')}],
   [L==='reception'&&/umbrella|badge/.test(c),()=>say('It’s in the lost & found box. Try <code>open box</code>.')],
  ];
  const h=T.find(t=>t[0]);if(h){h[1]();tick(5);save();return}
  const th=matchIn(thingList(),c);if(th)return say(`You can’t take the ${LOCS[L].things[th.id].n}. People would notice.`);
  if(matchIn(npcList(),c))return say('You can’t take people. HR has been very clear about this.');
  say('You can’t see that here.');
}
function drop(q){
  const it=matchIn(invList(),q);if(!it)return say('You don’t have that.');
  if(['signed','usbfile','keycard','key'].includes(it.id))return say('You’d better hang on to that.');
  lose(it.id);S.dropped=S.dropped||{};(S.dropped[S.loc]=S.dropped[S.loc]||[]).push(it.id);say(`You put down the ${I(ITEMS[it.id].n)}.`);tick(0);save();
}
function open(q){
  const c=norm(q);
  if(S.loc==='reception'&&/box|lost|found/.test(c)){
    if(S.f.lfOpened)return say('Just a sock left in there.');
    S.f.lfOpened=1;say('You rummage through the lost & found. Among the single gloves and a Nokia charger:');giveItem('umbrella');giveItem('badge');tick(5);save();return;
  }
  if(S.loc==='kitchen'&&/fridge/.test(c))return examine('fridge');
  if(S.loc==='kitchen'&&/cupboard|door/.test(c))return go('cupboard');
  if(S.loc==='kitchen'&&/tin/.test(c))return examine('tin');
  say('You can’t open that.');
}
function use(q){
  const c=norm(q);const [a,b]=c.split(/ (?:on|in|into|with|at) /);
  const it=matchIn(invList(),a||c);
  if(!it)return say('You don’t have that. Check your <code>inventory</code>.');
  const id=it.id,tgt=b||'';
  const L=S.loc;
  if(ITEMS[id].food&&!tgt){lose(id);S.energy=Math.min(S.max,S.energy+ITEMS[id].food);say(`You drink the flat white. Pure life. <span class="ex">+${ITEMS[id].food} energy.</span>`);tick(5);renderPanel();save();return}
  if(id==='biscuit'&&!tgt){lose(id);S.energy=Math.min(S.max,S.energy+3);say('You eat the biscuit. It was fine. <span class="ex">+3 energy.</span>');tick(0);save();return}
  if(id==='descaler'&&L==='kitchen'&&(!tgt||/machine|coffee/.test(tgt))){lose(id);S.f.descaled=1;say('You pour in the descaler. The machine gurgles, wheezes, then sighs with relief. The red light turns green. You can <code>make coffee</code> now.',[['Make coffee','make coffee',1]]);tick(10);renderPanel();save();return}
  if(id==='toner'&&L==='print'&&(!tgt||/printer/.test(tgt))){lose(id);S.f.toner=1;say('You wrestle the toner in. The printer goes quiet, then makes a noise like a cat seeing a cucumber. Something in tray 3 is <em>awake</em>.',[['Print the proofs','print',1]]);tick(5);renderPanel();save();return}
  if((id==='usb')&&L==='server'&&(!tgt||/nas|server|drive/.test(tgt))){lose('usb');S.f.copied=1;giveItem('usbfile',true);say(`You plug in Dan’s USB stick. <code>final_FINAL_v7_USE-THIS.psd</code>… copying… 2.4 GB… done. ${I('USB stick (with final file)')} is in your inventory.`);tick(10);renderPanel();save();return}

const FOES={
 gremlin:{name:'Paper Jam Gremlin',hp:20,atk:[2,5],lines:['*shreds an A4 sheet at you*','*PC LOAD LETTER*','*jams your sleeve in tray 3*','*prints 400 copies of someone’s payslip at you*'],win:()=>{S.f.gremlin=1;say('The gremlin dissolves into a puff of toner. The printer purrs.',[['Print the proofs','print',1]])}},

};
function weapon(){let b=0,n='fists';for(const id of S.inv){if(ITEMS[id].weapon&&ITEMS[id].weapon>b){b=ITEMS[id].weapon;n=ITEMS[id].n}}return {b,n}}
function startFight(k){
  const F=FOES[k];S.combat={k,name:F.name,hp:F.hp,max:F.hp,def:false,stun:0,muteUsed:false};
  post(S.view,'enemy',`<b>${F.name}</b> appears! ${pick(F.lines)}`+hpHtml());
  combatPrompt();renderChips();save();
}
function startWraith(){startQ('wraith');say('Your notification sound plays forty-seven times in a row. The replies knit themselves into a shape…');startFight('wraith')}
const hpHtml=()=>`<div class="hpbar"><span>HP ${Math.max(0,S.combat.hp)}/${S.combat.max}</span><span class="tr"><i style="width:${Math.max(0,S.combat.hp)/S.combat.max*100}%"></i></span></div>`;
function combatPrompt(){
  const acts=[['⚔️ Attack','attack',1],['🛡️ Defend','defend']];
  if(api.has('mute')&&!S.combat.muteUsed)acts.push(['🔇 Use mute button','use mute']);
  if(api.has('flatwhite'))acts.push(['☕ Drink flat white','use coffee']);
  if(api.has('biscuit'))acts.push(['🍪 Eat biscuit','use biscuit']);
  acts.push(['🏃 Flee','flee']);
  say(`Your move. Energy ${S.energy}/${S.max}. Weapon: ${weapon().n}.`,acts);
}
function combatCmd(v,r){
  const C=S.combat,F=FOES[C.k];let acted=true;
  if(v==='attack'||v==='hit'||v==='fight'){const w=weapon(),d=rnd(3,6)+w.b;C.hp-=d;say(`You hit it with your ${w.n}. <span class="dmg">−${d} HP.</span>`)}
  else if(v==='defend'||v==='block'){C.def=true;say('You brace yourself behind a laptop.')}
  else if(v==='use'||v==='drink'||v==='eat'){
    const it=matchIn(invList(),r);
    if(!it){say('Use what?');acted=false}
    else if(it.id==='mute'){if(C.muteUsed){say('You’ve already used it this fight.');acted=false}else{C.muteUsed=true;C.stun=1;say(`You slam the ${I('mute button')}. The ${F.name} is silenced for a turn!`)}}
    else if(it.id==='flatwhite'||it.id==='biscuit'){const g=it.id==='flatwhite'?14:3;lose(it.id);S.energy=Math.min(S.max,S.energy+g);say(`Quick refuel. <span class="ex">+${g} energy.</span>`)}
    else {say('That won’t help here.');acted=false}
  }
  else if(v==='flee'||v==='run'||v==='escape'){S.combat=null;say('You run for it. It’ll still be there later.');const back=S.loc==='general'?S.prev:S.loc==='print'?'studio':S.prev;renderChips();travel(back);return}
  else {say('In a fight you can <code>attack</code>, <code>defend</code>, <code>use</code> an item, or <code>flee</code>.');acted=false}
  if(!acted){combatPrompt();return}
  tick(0);
  if(C.hp<=0){S.combat=null;post(S.view,'enemy',`<b>${F.name}</b> is defeated!`);S.feeds[S.view][S.feeds[S.view].length-1].en=F.name;F.win();renderAll();save();return}
  if(C.stun>0){C.stun--;post(S.view,'enemy','<em>*muted. Furious, but muted.*</em>'+hpHtml())}
  else{let d=rnd(...F.atk);if(C.def)d=Math.ceil(d/2);if(api.has('headphones'))d=Math.max(0,d-2);S.energy-=d;C.def=false;
    post(S.view,'enemy',`${pick(F.lines)} <span class="dmg">−${d} energy.</span>`+hpHtml())}
  renderPanel();
  if(S.energy<=0){S.combat=null;renderChips();return checkEnergy()}
  combatPrompt();save();
}
function checkEnergy(){
  if(S.energy>0)return renderPanel();
  S.combat=null;S.energy=16;tick(60);
  const f=S.loc;S.loc='reception';S.view='reception';
  renderAll();post('reception','sys','💤 You ran out of energy and passed out.');
  say('You wake up on the reception sofa an hour later. Janet has put a blanket over you and a Post-it on your forehead that says “drink water”. <span class="ex">Energy back to 16.</span>');
  save();
}

   ENDINGS

function endGame(win){
  S.over=true;const side=['tup','usb','coffee','stapler','meeting','wraith','ghost'].filter(k=>QUESTS[k].steps.every(s=>s[1](api))).length;
  const left=DEADLINE-S.time,score=win?Math.round(left/5)*10+S.rep*50+side*60:S.rep*20+side*30;
  let best=0;try{best=+localStorage.getItem('hb-best')||0;if(score>best){best=score;localStorage.setItem('hb-best',best)}}catch(e){}
  const grade=!win?'—':score>1400?'S':score>1000?'A':score>700?'B':'C';
  post(S.view,'sys',win?`🎉 <b>Campaign shipped at ${hhmm(S.time)}</b><div class="card">Time to spare: ${Math.floor(left/60)}h ${left%60}m<br>Reputation: ${S.rep}<br>Side quests done: ${side} of 7<br>Score: <b>${score}</b> · Grade <b>${grade}</b> · Best ${best}</div>`
    :`🕠 <b>17:30. The campaign has slipped to Monday.</b><div class="card">Priya has gone quiet in a way that’s worse than shouting.<br>Reputation: ${S.rep} · Side quests: ${side} of 7 · Score ${score}</div>`,[['Play again','restart',1]]);
  renderPanel();save();
}
function restart(){try{localStorage.removeItem('hb-save')}catch(e){}S=fresh();boot(true)}

  const near=S.combat?[]:LOCS[S.loc].exits;

  $('chans').innerHTML=order.filter(id=>S.known.includes(id)).map(id=>{
    const on=id===S.view,nr=near.includes(id)||id==='general';const lock=LOCS[id].lock&&LOCS[id].lock(api);
    return `<button class="ch${on?' on':nr?' near':' far'}" data-go="${id}"><span class="h">#</span>${LOCS[id].n}${lock&&!on?'<span class="tag">🔒</span>':id===S.loc&&!on?'<span class="tag">you</span>':''}</button>`}).join('');
  $('dms').innerHTML=(S.met.length?S.met:[]).map(id=>`<button class="ch" data-dm="${id}"><span class="dot" style="background:${NPCS[id].at===S.loc?'#4fb676':'transparent'};border:1.5px solid #4fb676"></span>${NPCS[id].n}<span class="tag">${LOCS[NPCS[id].at].n}</span></button>`).join('')||'<div style="padding:4px 8px;font-size:13px;opacity:.7">Talk to people to add them here.</div>';
  $('sideClock').textContent='Tuesday · '+hhmm(S.time);
}
function renderPanel(){
  $('sEnergy').textContent=`${Math.max(0,S.energy)} / ${S.max}`;$('mEnergy').firstElementChild.style.width=Math.max(0,S.energy)/S.max*100+'%';$('mEnergy').classList.toggle('low',S.energy<10);
  const left=Math.max(0,DEADLINE-S.time);$('sTime').textContent=`${hhmm(S.time)} · ${Math.floor(left/60)}h ${left%60}m left`;$('mTime').firstElementChild.style.width=left/DEADLINE*100+'%';
  $('sRep').textContent=S.rep;
  $('invCount').textContent=S.inv.length;
  $('inv').innerHTML=S.inv.map(id=>`<button class="item" data-x="${id}"><span class="ic">${ITEMS[id].ic}</span><span><b>${ITEMS[id].n}</b><small>${ITEMS[id].weapon?'+'+ITEMS[id].weapon+' damage':ITEMS[id].def?'−'+ITEMS[id].def+' damage taken':ITEMS[id].food?'+'+ITEMS[id].food+' energy':'Click to examine'}</small></span></button>`).join('')||'<div class="empty">Empty. Try the lost & found in reception.</div>';
  const qs=Object.keys(S.q).sort((a,b)=>(a==='main'?-1:b==='main'?1:0));
  $('quests').innerHTML=qs.map(id=>{const Q=QUESTS[id],done=Q.steps.every(s=>s[1](api));return `<div class="q${done?' done':''}"><b>${Q.n}<small>${done?'Done':'from '+Q.giver}</small></b><ul>${Q.steps.map(s=>`<li class="${s[1](api)?'ok':''}">${s[0]}</li>`).join('')}</ul></div>`}).join('')||'<div class="empty">No quests yet. Talk to Priya in #studio.</div>';
  $('meTitle').textContent=S.f.won?'Designer · campaign shipped':'Designer · on a deadline';
  renderSide();
}
function renderChips(){
  const c=[];
  if(S.over)c.push(['Play again','restart','go']);
  else if(S.combat){c.push(['⚔️ Attack','attack','fight'],['🛡️ Defend','defend','fight']);if(api.has('mute')&&!S.combat.muteUsed)c.push(['🔇 Mute','use mute','fight']);c.push(['🏃 Flee','flee',''])}
  else{
    c.push(['👀 Look','look','']);
    npcsAt(S.loc).forEach(n=>c.push(['💬 '+NPCS[n].n,'talk '+NPCS[n].n.toLowerCase(),'pp']));
    Object.values(LOCS[S.loc].things||{}).slice(0,3).forEach(t=>c.push(['🔍 '+t.n,'examine '+t.n,'']));
    LOCS[S.loc].exits.forEach(e=>c.push(['→ #'+LOCS[e].n,'go '+LOCS[e].n,'go']));
    c.push(['🎒 Inventory','inventory',''],['📌 Quests','quests','']);
  }
  $('chips').innerHTML=c.map(x=>`<button class="chip ${x[2]}" data-cmd="${esc(x[1])}">${x[0]}</button>`).join('');
}
function renderHead(){
  if(boss){$('chName').textContent='# general';$('chTopic').textContent='Company-wide announcements and work-based matters';$('input').placeholder='Message #general';return}
  const L=LOCS[S.view];$('chName').textContent='# '+L.n;$('chTopic').textContent=L.topic;$('input').placeholder=`Message #${L.n} — try “look”, “help”`;
}
function renderAll(){renderHead();renderFeed();renderPanel();renderChips()}

/* =========================================================
   INPUT
   ========================================================= */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cmd]');if(c&&!boss){const cmd=c.getAttribute('data-cmd');
    // talk topics use "talk npc:topic"
    if(/^talk \w+:\w+$/.test(cmd)){const [n,t]=cmd.slice(5).split(':');post(S.view,'you',esc(c.textContent));talk(n,t);renderAll();return}
    run(cmd.replace(/’/g,"'"));renderAll();$('input').focus({preventScroll:true});return}
  const g=e.target.closest('[data-go]');if(g&&!boss){closeSide();const id=g.dataset.go;if(id===S.loc&&S.view!==S.loc){S.view=S.loc;renderAll();return}run('go '+LOCS[id].n);renderAll();return}
  const d=e.target.closest('[data-dm]');if(d&&!boss){closeSide();const id=d.dataset.dm;if(NPCS[id].at!==S.loc||(id==='ghost'&&S.f.ghost)){say(`${P(NPCS[id].n)} isn’t here. They’re in ${X(LOCS[NPCS[id].at].n)}.`);return}run('talk '+NPCS[id].n);renderAll();return}
  const x=e.target.closest('[data-x]');if(x&&!boss){run('examine '+ITEMS[x.dataset.x].n);return}
});
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('input').value.trim();$('input').value='';if(!v)return;
  if(boss){DECOY.push(['you',v]);renderDecoy();return}
  run(v);renderAll()});
$('appInv').onclick=()=>{closeSide();run('inventory');renderAll()};
$('appQuest').onclick=()=>{closeSide();run('quests');renderAll()};
$('appHelp').onclick=()=>{closeSide();run('help');renderAll()};
$('panelBtn').onclick=()=>$('panel').classList.toggle('open');
$('menuBtn').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('open')};
$('scrim').onclick=closeSide;
function closeSide(){$('side').classList.remove('open');$('scrim').classList.remove('open')}

/* =========================================================
   DISGUISE
   ========================================================= */
const DECOY=[['priya','Morning all. Brightwave proofs due today, I’ll chase sign-off this afternoon.'],['janet','Reminder: the kitchen fridge gets cleared on Friday. Label your food, please.'],['dan','Server maintenance Saturday 8–12. Nothing needed from you.'],['tom','Has anyone seen a red stapler?'],['you','Working on the spring cut-downs, should have them over by 3.']];
let boss=false;
function renderDecoy(){
  const d=$('decoy');d.innerHTML='';d.appendChild(msgEl({who:'day',html:'Today'}));
  DECOY.forEach(([w,t],i)=>d.appendChild(msgEl({who:w,html:esc(t),t:['09:12','09:31','10:04','10:48','11:02'][i]||'11:10'})));
}
function toggleBoss(){
  boss=!boss;document.body.classList.toggle('boss',boss);
  if(boss){renderDecoy();$('panel').classList.remove('open')}
  renderHead();if(!boss)renderAll();
  $('chans').querySelectorAll('.ch').forEach(b=>b.classList.toggle('on',boss?b.dataset.go==='general':b.dataset.go===S.view));
  window.LookBusy&&queueMicrotask(()=>window.LookBusy.sync());
}
$('hideBtn').onclick=toggleBoss;
addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();toggleBoss()}});

/* =========================================================
   BOOT
   ========================================================= */
function boot(isNew){
  if(!S){S=load();if(!S){S=fresh();isNew=true}}
  if(isNew){
    S.feeds={};post('reception','day','Today');
    post('reception','sys','👋 Welcome to <b>Studio Ops</b>. This whole workspace is a text adventure. Channels are places, DMs are people.<br>Type commands (<code>look</code>, <code>go kitchen</code>, <code>take biscuit</code>, <code>talk to janet</code>) or click the buttons. <code>help</code> lists everything. You’ve got until <b>17:30</b>.');
    say(`<p>It’s 09:00 on a Tuesday. You’ve just badged in. Your phone buzzes: a message from ${P('Priya')} in ${X('studio')}.</p><p><b>Priya:</b> “Where are you?? Come to the studio ASAP. Brightwave. Today. 😬”</p>`);
    look();
  }
  renderAll();save();
}
S=null;boot(false);
window.LookBusy&&window.LookBusy.register({name:'Hubbub',goal:'A text adventure hiding in a team chat. Ship the spring campaign by 17:30: explore channels, talk to people, collect items and finish quests.',controls:[['Type commands','look, go kitchen, take biscuit, use toner on printer, give tupperware to janet, talk to priya'],['Click','Buttons, chips, channels and DMs all work too'],['help','List every command'],['restart','Start a new day']],file:'hubbub-rpg.html',toggle:toggleBoss,isHidden:()=>boss});
})();
</script>

</html>
