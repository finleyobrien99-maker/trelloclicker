<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mail – Inbox</title>
<style>
/* Deliberately single-theme and system-font: it has to pass as a light desktop mail client. */
:root{
  --bg:#ffffff; --pane:#f5f5f5; --panel:#faf9f8; --text:#242424; --muted:#616161; --line:#e0e0e0; --hover:#f0f0f0;
  --brand:#1f5fa8; --brandDark:#184c87; --brandSoft:#e8f1fb; --sel:#cfe4fa; --unread:#1f5fa8;
  --warnBg:#fff4ce; --warnLine:#e6c55c; --badBg:#fde7e9; --badLine:#e8a6ad; --bad:#a4262c; --okBg:#dff6dd; --ok:#107c10; --extBg:#fff4ce;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:14px;overflow:hidden;color-scheme:light}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.app{display:grid;grid-template-rows:48px auto minmax(0,1fr);height:100%}

/* top bar */
.top{background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:0 12px}
.waffle{display:grid;grid-template-columns:repeat(3,4px);gap:3px;padding:8px}
.waffle i{width:4px;height:4px;background:#fff;border-radius:1px}
.appname{font-weight:600;font-size:16px}
.search{flex:1;max-width:520px;margin:0 auto;background:#fff;color:#707070;border-radius:4px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px}
.tr{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.clock{font-size:13px;opacity:.95;white-space:nowrap}
.me{width:32px;height:32px;border-radius:50%;background:#c77d3a;display:grid;place-items:center;font-weight:600;font-size:13px}

/* ribbon */
.ribbon{display:flex;align-items:center;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;scrollbar-width:none}
.ribbon::-webkit-scrollbar{display:none}
.rb{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px;white-space:nowrap;color:var(--text)}
.rb:hover:not(:disabled){background:var(--hover)}
.rb:disabled{opacity:.4;cursor:default}
.rb svg{flex:none}
.rb.primary{background:var(--brand);color:#fff}
.rb.primary:hover{background:var(--brandDark)}
.rb kbd{font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.rsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.rtxt{color:var(--muted);padding:6px 8px;white-space:nowrap}

/* main */
.main{display:grid;grid-template-columns:48px 220px 360px minmax(0,1fr);min-height:0}
.rail{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px}
.rail span{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.rail span.on{background:var(--brandSoft);color:var(--brand)}
.folders{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.fscroll{overflow-y:auto;padding:10px 6px;flex:1}
.fh{font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px 4px;display:flex;gap:6px;align-items:center}
.fo{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:4px;font-size:14px}
.fo.on{background:var(--sel);font-weight:600}
.fo .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fo.on .n,.fo .n.b{color:var(--brand);font-weight:600}
.stor{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);transition:width .3s}
.meter.hot i{background:var(--bad)}
.stor .r{display:flex;justify-content:space-between}
.stor b{color:var(--text);font-weight:600}
.dots{letter-spacing:3px;color:var(--bad)}

/* list */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lh{display:flex;align-items:center;gap:16px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.lt{padding:6px 0 8px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.lt.on{color:var(--text);border-bottom-color:var(--brand)}
.lh .sort{margin-left:auto;font-size:12px;color:var(--muted);padding-bottom:8px}
.strip{display:none;gap:12px;padding:6px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.strip b{color:var(--text)}
.items{overflow-y:auto;flex:1}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px 4px}
.it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px 9px 11px;border-left:3px solid transparent;border-bottom:1px solid #f0f0f0;cursor:pointer;width:100%;text-align:left}
.it:hover{background:var(--hover)}
.it.sel{background:var(--sel)}
.it.unread{border-left-color:var(--unread)}
.it .av{grid-row:span 3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.it .fr{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.unread .fr{font-weight:700}
.it .tm{font-size:12px;color:var(--muted);text-align:right}
.it .sj{grid-column:2/4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.it.unread .sj{color:var(--brand);font-weight:600}
.it .pv{grid-column:2/4;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .new{animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* reading */
.read{overflow-y:auto;background:var(--bg);min-width:0}
.rin{padding:20px 28px 40px;max-width:820px}
.back{display:none;align-items:center;gap:6px;color:var(--brand);font-weight:600;padding:10px 0 0 16px}
.subj{font-size:20px;font-weight:600;margin:0 0 14px;line-height:1.3;text-wrap:balance}
.bar{border:1px solid;border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:12px;line-height:1.45;display:flex;gap:8px}
.bar.ext{background:var(--extBg);border-color:var(--warnLine)}
.bar.bad{background:var(--badBg);border-color:var(--badLine);color:#5c1318}
.bar.ok{background:var(--okBg);border-color:#9fd89f;color:#0b4a0b}
.bar.tip{background:var(--brandSoft);border-color:#b4d0ef}
.snd{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 12px;align-items:center;margin-bottom:18px}
.snd .av{grid-column:1;grid-row:1/3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600}
.snd .nm{grid-column:2;grid-row:1;font-weight:600;overflow-wrap:anywhere}
.snd .ad{color:var(--muted);font-weight:400}
.snd .to{grid-column:2;grid-row:2;font-size:12px;color:var(--muted)}
.snd .tm{grid-column:3;grid-row:1;font-size:12px;color:var(--muted)}
.body{line-height:1.6;font-size:14.5px;max-width:64ch}
.body p{margin:0 0 12px}
.body a{color:var(--brand);text-decoration:underline;cursor:pointer}
.att{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin:4px 0 14px;cursor:pointer;background:var(--bg)}
.att:hover{background:var(--hover)}
.att .ic{width:28px;height:32px;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
.att small{display:block;color:var(--muted);font-size:12px}
.policy li{margin-bottom:8px}
.policy .newrule{background:#fff4ce;padding:1px 4px;border-radius:3px}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(440px,100%);padding:22px 24px}
.dlg h2{margin:0 0 8px;font-size:20px;font-weight:600}
.dlg p{margin:0 0 10px;color:#424242;line-height:1.5}
.dlg table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.dlg td{padding:5px 0;border-bottom:1px solid #f0f0f0}
.dlg td:last-child{text-align:right;font-weight:600}
.dlg .tot td{border-top:2px solid #424242;border-bottom:0;font-weight:700}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{background:var(--brand);color:#fff;border-radius:4px;padding:7px 18px;font-weight:600}
.btn:hover{background:var(--brandDark)}
.btn.sec{background:#fff;color:var(--text);border:1px solid #d1d1d1}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#292929;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}

@media (max-width:1180px){.main{grid-template-columns:48px 190px 320px minmax(0,1fr)}}
@media (max-width:980px){.main{grid-template-columns:0 0 340px minmax(0,1fr)}.rail,.folders{display:none}.strip{display:flex}}
@media (max-width:720px){
  .main{grid-template-columns:minmax(0,1fr)}
  .read{position:fixed;inset:calc(48px + env(safe-area-inset-top,0px)) 0 0 0;z-index:20;transform:translateX(100%);transition:transform .2s}
  body.reading .read{transform:none}
  .back{display:flex}
  .rin{padding:12px 16px 40px}
  .search{display:none}.tr{margin-left:auto}
  .ribbon .rtxt,.ribbon .deco,.rb kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <span class="waffle" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="appname">Mail</span>
    <div class="search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>Search</div>
    <div class="tr"><span class="clock" id="clock"></span><span class="me">F</span></div>
  </header>

  <div class="ribbon" role="toolbar" aria-label="Mail actions">
    <button class="rb primary" id="newMail">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="3.5" width="13" height="9" rx="1"/><path d="m2 4 6 4.5L14 4"/></svg><span id="newMailTxt">Clock in</span></button>
    <span class="rsep"></span>
    <button class="rb" data-a="reply" title="Reply (R)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4 2 8l4 4M2 8h7a5 5 0 0 1 5 5"/></svg>Reply<kbd>R</kbd></button>
    <button class="rb" data-a="archive" title="Archive (E)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="3" rx=".5"/><path d="M2.5 5.5v8h11v-8M6 8.5h4"/></svg>Archive<kbd>E</kbd></button>
    <button class="rb" data-a="junk" title="Junk (J)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M3.8 3.8l8.4 8.4"/></svg>Junk<kbd>J</kbd></button>
    <button class="rb" data-a="report" title="Report phishing (P)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 14.5V2M3.5 2.5h9l-2 3 2 3h-9"/></svg>Report phishing<kbd>P</kbd></button>
    <span class="rsep deco"></span>
    <span class="rtxt deco">Move to ▾</span><span class="rtxt deco">Categorise ▾</span><span class="rtxt deco">Flag ▾</span>
  </div>

  <div class="main">
    <nav class="rail" aria-hidden="true">
      <span class="on"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="3.5" width="13" height="9" rx="1"/><path d="m2 4 6 4.5L14 4"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg></span>
      <span><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.5" r="3"/><path d="M2.5 14.5c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.5"/></svg></span>
    </nav>

    <aside class="folders">
      <div class="fscroll">
        <div class="fh">▾ Favourites</div>
        <div class="fo on">Inbox <span class="n b" id="fInbox">0</span></div>
        <div class="fo">Sent Items <span class="n" id="fSent"></span></div>
        <div class="fo">Drafts</div>
        <div class="fh">▾ fin@studioops.co.uk</div>
        <div class="fo">Inbox</div>
        <div class="fo">Archive <span class="n" id="fArch"></span></div>
        <div class="fo">Junk Email <span class="n" id="fJunk"></span></div>
        <div class="fo">Reported <span class="n" id="fRep"></span></div>
        <div class="fo">Deleted Items</div>
        <div class="fo">Conversation History</div>
      </div>
      <div class="stor">
        <div class="r"><span id="sDay">Monday</span><span><b id="sPay">£0</b> today</span></div>
        <div class="r"><span>IT warnings</span><span class="dots" id="sWarn">○○○</span></div>
        <div class="r"><span>Mailbox</span><span id="sStor">0% full</span></div>
        <div class="meter" id="sMeter"><i style="width:0%"></i></div>
        <div class="r"><span>Savings</span><b id="sSave">£0</b></div>
      </div>
    </aside>

    <section class="list">
      <div class="lh"><span class="lt on">Focused</span><span class="lt">Other</span><span class="sort">By date ▾</span></div>
      <div class="strip" id="strip"></div>
      <div class="items" id="items"></div>
    </section>

    <section class="read" id="read"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden><div class="dlg" id="dlg"></div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const DOM='studioops.co.uk';
const DAYN=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const DAY_LEN=150;          // real seconds from 09:00 to 17:30
const FULL=18;              // mailbox full at this many waiting
const PAY={reply:12,archive:6,junk:4,report:20};
const COLS=['#1f5fa8','#a0376a','#4f7d3a','#b4552d','#6b4f9e','#0f7c86','#8a6d1f','#c43e1c','#5a5fb0'];
const col=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return COLS[h%COLS.length]};
const ini=n=>n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const L=(text,url)=>`<a data-url="${esc(url)}" title="${esc(url)}">${text}</a>`;
const ATT=(name,size,c)=>({name,size,c});

/* ---------- the rulebook, one new rule a day ---------- */
const RULES=[
 {d:1,t:'<b>Reply</b> to anything that asks you a question — colleagues at @studioops.co.uk, or our client at <b>@brightwave.co.uk</b>.'},
 {d:1,t:'<b>Archive</b> FYIs, notifications and newsletters. Nothing to do, nothing to say.'},
 {d:1,t:'Send obvious spam (prizes, crypto, miracle SEO, followers) to <b>Junk</b>.'},
 {d:2,t:'<b>Report phishing</b>: anything that wants you to sign in, reset a password, pay a fee or open an unexpected attachment. Check the sender’s address: lookalikes like <b>studi0ops</b> or <b>studioops-support.com</b> are fake. Click a link to see where it really goes.'},
 {d:3,t:'Invoices: only these suppliers are approved: <b>Printwise Ltd</b> (printwise.co.uk), <b>Lumen Studios</b> (lumenstudios.co.uk), <b>Kettle &amp; Co</b> (kettleandco.co.uk). Approved invoice → <b>Archive</b>. Unknown supplier, lookalike domain, or “our bank details have changed” → <b>Report</b>.'},
 {d:4,t:'Nobody here will ever ask you to buy gift cards, move money or “keep this between us” — even if it says it’s from the Director. <b>Report</b> it. Real directors email from @studioops.co.uk.'},
 {d:5,t:'It’s Friday. Everything applies, and it’s busy. Survive till 17:30.'},
];

/* ---------- email templates ---------- */
const T=[
 // replies
 {d:1,k:'reply',f:['Priya Shah','priya.shah@'+DOM],s:'Resized assets?',b:'<p>Hi Fin,</p><p>Any chance you could send the 4:5 versions of the spring banners over by 3? Client’s chasing.</p><p>Thanks, P</p>',why:'Priya asked you a question. Reply.'},
 {d:1,k:'reply',f:['Tom Whitfield','tom.whitfield@'+DOM],s:'Font on the spring deck',b:'<p>Which weight of the headline font are we using on the spring deck? Mine’s looking a bit chunky.</p><p>Tom</p>',why:'Tom asked you a question. Reply.'},
 {d:1,k:'reply',f:['Janet Cole','janet.cole@'+DOM],s:'Friday drinks 🍻',b:'<p>Are you coming Friday? Need numbers for the pizza order by Thursday!</p><p>J x</p>',why:'Janet needs an answer. Reply.'},
 {d:1,k:'reply',f:['Mark Delaney','mark.delaney@'+DOM],s:'Can you make the 2pm?',b:'<p>Client’s moved the call to 2pm. Can you make it?</p><p>M</p>',why:'Mark asked if you can make it. Reply.'},
 {d:1,k:'reply',f:['Sophie Grant','sophie.grant@brightwave.co.uk'],s:'Round 2 feedback',b:'<p>Hi Fin,</p><p>Loving the direction. Could we see the hero with the product a bit larger? When could you turn that around?</p><p>Best, Sophie<br>Brightwave</p>',why:'Brightwave is our real client and Sophie asked a question. Reply.'},
 {d:1,k:'reply',f:['Priya Shah','priya.shah@'+DOM],s:'Photographer for Thursday?',b:'<p>Did you ever hear back from the photographer about Thursday? Need to lock the studio.</p>',why:'Priya asked you a question. Reply.'},
 {d:4,k:'reply',f:['Helen Ward (Director)','helen.ward@'+DOM],s:'Case study for the pitch',b:'<p>Hi Fin,</p><p>Could you pull together a one-page case study on the Brightwave work for Monday’s pitch? What do you need from me?</p><p>Helen</p>',why:'That was the real Director, from @studioops.co.uk, asking a normal work question. Reply.'},
 // archive
 {d:1,k:'archive',f:['Facilities','facilities@'+DOM],s:'Kitchen closed Friday afternoon',b:'<p>FYI the kitchen will be closed from 2pm Friday for the deep clean. No action needed.</p>',why:'Just an FYI. Archive it.'},
 {d:1,k:'archive',f:['Timesheets','noreply@'+DOM],s:'Your timesheet was approved',b:'<p>Your timesheet for last week has been approved by Mark Delaney.</p><p>This is an automated message.</p>',why:'Automated notification. Archive it.'},
 {d:1,k:'archive',f:['Type Weekly','hello@typeweekly.com'],s:'This week: 12 serifs we can’t stop using',b:'<p>Hello type fans,</p><p>This week we’re rounding up twelve serifs with real personality, plus an interview with a lettering artist.</p><p>'+'Read online'+' · Unsubscribe</p>',why:'Newsletter you signed up to. Archive it.'},
 {d:1,k:'archive',f:['Priya Shah','priya.shah@'+DOM],s:'Notes from Monday’s WIP',b:'<p>Hi all,</p><p>Notes from Monday attached. Nothing needed from anyone, just for reference.</p>',att:ATT('WIP notes.docx','24 KB','#1f5fa8'),why:'“Nothing needed” means Archive.'},
 {d:1,k:'archive',f:['IT Service Desk','it@'+DOM],s:'Planned maintenance this Saturday',b:'<p>The file server will be offline from 8am to 12pm on Saturday for planned maintenance. You don’t need to do anything.</p>',why:'Genuine IT notice from @studioops.co.uk, no action needed. Archive.'},
 // junk
 {d:1,k:'junk',f:['Prize Centre','claims@mega-winnerz.biz'],s:'🎉 You’ve WON a £500 voucher!!!',b:'<p>CONGRATULATIONS!!! You have been selected as todays lucky WINNER. Claim now before it expires!!!</p>',why:'Obvious spam. Junk.'},
 {d:1,k:'junk',f:['Rank Rocket','growth@rankrocket-seo.info'],s:'Your site to #1 in 24 hours GUARANTEED',b:'<p>Dear Website Owner, we noticed your site is not ranking. For only £99 we GUARANTEE page one.</p>',why:'SEO spam. Junk.'},
 {d:1,k:'junk',f:['Crypto Kings','vip@moonbag-capital.io'],s:'Turn £50 into £5,000 by Friday',b:'<p>Our members are making life-changing money. Spaces are limited. Reply YES to join.</p>',why:'Crypto spam. Junk.'},
 {d:1,k:'junk',f:['InstaGrowth','deals@followers4less.shop'],s:'10,000 REAL followers for £9.99',b:'<p>Boost your brand overnight with 10,000 100% real followers. Limited offer.</p>',why:'Follower spam. Junk.'},
 // phishing
 {d:2,k:'report',f:['IT Support','helpdesk@studioops-support.com'],s:'Action required: password expires today',b:'<p>Your password will expire in 2 hours. To keep access to your mailbox, reset it now:</p><p>'+L('https://studioops.co.uk/password','http://studioops.co.uk.verify-login.ru/reset')+'</p><p>IT Support Team</p>',why:'Phishing: studioops-support.com isn’t us, and the link goes to a .ru site.'},
 {d:2,k:'report',f:['Priya Shah','priya.shah@studi0ops.co.uk'],s:'Invoice attached — urgent',b:'<p>Hi, can you open the attached and confirm today please. Thanks</p>',att:ATT('Invoice_0923.zip','311 KB','#8a6d1f'),why:'Phishing: studi0ops with a zero, plus a surprise .zip.'},
 {d:2,k:'report',f:['SecureDocs','share@securedocs-files.net'],s:'Janet Cole shared “Q3 salaries.xlsx” with you',b:'<p>Janet Cole has shared a file with you.</p><p>'+L('Open document','http://securedocs-files.net/login?user=fin')+'</p><p>You’ll need to sign in with your work email to view.</p>',why:'Phishing: a random file site asking you to sign in with your work account.'},
 {d:2,k:'report',f:['Parcel Delivery','track@royal-parcels-uk.com'],s:'We missed you — £1.99 redelivery fee',b:'<p>We tried to deliver your parcel today. To rebook, pay the £1.99 fee here:</p><p>'+L('Rebook delivery','http://royal-parcels-uk.com.pay-fee.top/card')+'</p>',why:'Phishing: asking for a payment through a dodgy link.'},
 {d:2,k:'report',f:['Account Security Team','no-reply@account-alerts-secure.com'],s:'Unusual sign-in activity',b:'<p>We detected an unusual sign-in to your account. If this wasn’t you, secure your account immediately:</p><p>'+L('Review activity','http://account-alerts-secure.com/secure?id=77413')+'</p>',why:'Phishing: fake account alert on a lookalike domain.'},
 // invoices
 {d:3,k:'archive',f:['Printwise Ltd','accounts@printwise.co.uk'],s:'Invoice PW-2231 — leaflet print run',b:'<p>Hi Fin,</p><p>Please find attached invoice PW-2231 for £1,240.00. Payment to the usual account as always.</p><p>Thanks, Printwise Accounts</p>',att:ATT('PW-2231.pdf','88 KB','#c43e1c'),why:'Printwise is approved and the domain’s right. Archive.'},
 {d:3,k:'archive',f:['Lumen Studios','billing@lumenstudios.co.uk'],s:'Invoice LS-0418 — product shoot',b:'<p>Invoice LS-0418 for the product shoot on the 14th, £2,850.00. Usual terms.</p><p>Lumen Studios</p>',att:ATT('LS-0418.pdf','102 KB','#c43e1c'),why:'Lumen Studios is approved. Archive.'},
 {d:3,k:'archive',f:['Kettle & Co','hello@kettleandco.co.uk'],s:'Invoice KC-112 — client lunch catering',b:'<p>Thanks for having us! Invoice KC-112 attached, £186.50.</p><p>Kettle &amp; Co</p>',att:ATT('KC-112.pdf','41 KB','#c43e1c'),why:'Kettle & Co is approved. Archive.'},
 {d:3,k:'report',f:['Printwise Ltd','accounts@printwise-invoices.com'],s:'Invoice PW-2240 — overdue',b:'<p>Our records show invoice PW-2240 (£4,610.00) is overdue. Please pay today to avoid a late fee.</p>',att:ATT('PW-2240.pdf','90 KB','#c43e1c'),why:'Invoice fraud: printwise-invoices.com isn’t Printwise’s real domain.'},
 {d:3,k:'report',f:['Lumen Studios','billing@lumenstudios.co.uk'],s:'Updated bank details — please read',b:'<p>Hi Fin,</p><p>Please note our bank details have changed. Could you pay invoice LS-0421 (£6,200.00) to our new account below from now on?</p><p>Sort code 40-11-62 · Account 90817263</p>',why:'Changed bank details is a classic invoice scam, even from a real supplier’s address. Report.'},
 {d:3,k:'report',f:['Nova Print Solutions','billing@novaprint.co'],s:'FINAL NOTICE: invoice NP-3301',b:'<p>This is a final notice for invoice NP-3301, £2,995.00. Failure to pay will result in legal action.</p>',att:ATT('NP-3301.pdf','76 KB','#c43e1c'),why:'Nova Print isn’t an approved supplier. Report.'},
 // CEO fraud
 {d:4,k:'report',f:['Helen Ward (Director)','director.studioops@gmail.com'],s:'Quick favour — keep this between us',b:'<p>Fin, are you at your desk? I need you to pick up 5 × £100 gift cards for a client thank-you. Keep this between us for now, I’ll explain later. Send me the codes.</p><p>Sent from my phone</p>',why:'CEO fraud: a Gmail address, gift cards and secrecy. Report.'},
 {d:4,k:'report',f:['Helen Ward','h.ward@studioops-group.com'],s:'Urgent transfer before 4pm',b:'<p>I’m in meetings all day. Please move £8,400 to the account below before 4pm to secure the venue. Don’t call, just confirm by email.</p>',why:'CEO fraud: wrong domain, urgent money transfer, “don’t call”. Report.'},
];

/* ---------- state ---------- */
let G={day:1,week:1,savings:0,best:0};
try{const s=JSON.parse(localStorage.getItem('ib-save')||'null');if(s&&s.day)G=Object.assign(G,s)}catch(e){}
const save=()=>{try{localStorage.setItem('ib-save',JSON.stringify(G))}catch(e){}};
let D=null,boss=false,uid=1,lastWhy=null,lastOk=null;
const monday=(()=>{const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-((t.getDay()+6)%7));return t})();
const ruleDay=()=>Math.min(G.day,5);
const gap=()=>Math.max(2.4,[8,7,6,5.5,4.5][ruleDay()-1]*Math.pow(.88,G.week-1));
const clockStr=m=>{const t=9*60+Math.floor(m);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};

function newDay(){
  D={emails:[],sel:'policy',warn:0,handled:0,right:0,pay:0,clock:0,running:false,acc:0,next:2,counts:{sent:0,arch:0,junk:0,rep:0},startSavings:G.savings};
  for(let i=0;i<3;i++)spawn(true);
  lastWhy=null;lastOk=null;
}
function spawn(quiet){
  const rd=ruleDay();
  const pool=[];T.forEach(t=>{if(t.d<=rd){const w=t.d===rd&&rd>1?3:1;for(let i=0;i<w;i++)pool.push(t)}});
  const recent=D.emails.slice(0,3).map(e=>e.tpl);
  let t,n=0;do{t=pick(pool);n++}while(recent.includes(t)&&n<8);
  D.emails.unshift({id:uid++,tpl:t,read:false,time:clockStr(D.clock),fresh:!quiet});
  if(!quiet&&!boss){renderList();renderHud()}
}

/* ---------- render ---------- */
const expected=e=>e.tpl.k;
function policyHTML(){
  const rd=ruleDay();
  return `<ol class="policy">${RULES.filter(r=>r.d<=rd).map(r=>`<li>${r.d===rd&&rd>1?'<span class="newrule">New today:</span> ':''}${r.t}</li>`).join('')}</ol>
  <p>Mistakes earn an IT warning. Three warnings in a day and HR will want a word. Anything still sitting in your inbox at 17:30 costs you.</p><p>Keyboard: R reply · E archive · J junk · P report · ↑↓ move between emails · Esc if someone walks past.</p><p>IT &amp; Security</p>`;
}
function renderList(){
  const it=$('items');
  let h=`<div class="grp">Pinned</div>
   <button class="it${D.sel==='policy'?' sel':''}${D.policyUnread?' unread':''}" data-id="policy"><span class="av" style="background:#424242">IT</span><span class="fr">IT &amp; Security</span><span class="tm">📌</span><span class="sj">Email policy — ${DAYN[(G.day-1)%5]}</span><span class="pv">How to handle what lands in your inbox today</span></button>`;
  h+=`<div class="grp">Today</div>`;
  if(!D.emails.length)h+=`<div class="empty">All caught up. Enjoy the quiet while it lasts.</div>`;
  D.emails.forEach(e=>{const t=e.tpl;
    h+=`<button class="it${D.sel===e.id?' sel':''}${e.read?'':' unread'}" data-id="${e.id}"><span class="av" style="background:${col(t.f[0])}">${ini(t.f[0])}</span><span class="fr">${esc(t.f[0])}</span><span class="tm">${e.time}</span><span class="sj">${t.att?'📎 ':''}${esc(t.s)}</span><span class="pv">${esc(t.b.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim())}</span></button>`});
  it.innerHTML=h;
  D.emails.forEach(e=>e.fresh=false);
}
function sender(name,addr,time){
  return `<div class="snd"><span class="av" style="background:${col(name)}">${ini(name)}</span><div class="nm">${esc(name)} <span class="ad">&lt;${esc(addr)}&gt;</span></div><span class="tm">${time}</span><div class="to">To: Fin</div></div>`;
}
function feedback(){
  if(lastWhy)return `<div class="bar bad"><b>IT&nbsp;Security, on&nbsp;that&nbsp;last&nbsp;one:</b><span>${esc(lastWhy)}</span></div>`;
  if(lastOk)return `<div class="bar ok"><span>${esc(lastOk)}</span></div>`;
  return '';
}
function renderRead(){
  const r=$('read');
  const back=`<button class="back" id="backBtn">‹ Inbox</button>`;
  if(D.sel==='policy'){
    r.innerHTML=back+`<div class="rin">${feedback()}<h1 class="subj">Email policy — ${DAYN[(G.day-1)%5]}${G.week>1?' (week '+G.week+')':''}</h1>${sender('IT & Security','security@'+DOM,'08:55')}<div class="body">${policyHTML()}</div></div>`;
  }else{
    const e=D.emails.find(x=>x.id===D.sel);
    if(!e){r.innerHTML=back+`<div class="rin">${feedback()}<div class="empty">Select an item to read</div></div>`;wireRead();return}
    const t=e.tpl,ext=!t.f[1].endsWith('@'+DOM);
    r.innerHTML=back+`<div class="rin">${feedback()}<h1 class="subj">${esc(t.s)}</h1>
      ${ext?`<div class="bar ext"><span>⚠</span><span>This message came from outside your organisation. Don’t click links or open attachments unless you trust the sender.</span></div>`:''}
      ${sender(t.f[0],t.f[1],e.time)}
      ${t.att?`<button class="att" id="attBtn"><span class="ic" style="background:${t.att.c}">${t.att.name.split('.').pop().toUpperCase()}</span><span>${esc(t.att.name)}<small>${t.att.size}</small></span></button>`:''}
      <div class="bar tip" id="linkTip" hidden></div>
      <div class="body">${t.b}</div></div>`;
  }
  wireRead();
}
function wireRead(){
  const b=$('backBtn');if(b)b.onclick=()=>document.body.classList.remove('reading');
  $('read').querySelectorAll('a[data-url]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const tip=$('linkTip');tip.hidden=false;tip.innerHTML=`<span>🔗</span><span>This link goes to <b>${esc(a.dataset.url)}</b></span>`});
  const at=$('attBtn');if(at)at.onclick=()=>{const tip=$('linkTip');tip.hidden=false;tip.innerHTML=`<span>📎</span><span>Preview isn’t available for this file. It’s probably best not to download it until you know who sent it.</span>`};
}
function renderHud(){
  const n=D.emails.length,pct=Math.min(100,Math.round(n/FULL*100));
  $('fInbox').textContent=n||'';
  $('fSent').textContent=D.counts.sent||'';$('fArch').textContent=D.counts.arch||'';$('fJunk').textContent=D.counts.junk||'';$('fRep').textContent=D.counts.rep||'';
  const dn=DAYN[(G.day-1)%5]+(G.week>1?' · wk '+G.week:'');
  $('sDay').textContent=dn;$('sPay').textContent='£'+D.pay;
  $('sWarn').textContent='●'.repeat(D.warn)+'○'.repeat(Math.max(0,3-D.warn));
  $('sStor').textContent=pct+'% full';
  $('sMeter').firstElementChild.style.width=pct+'%';$('sMeter').classList.toggle('hot',pct>=70);
  $('sSave').textContent='£'+G.savings.toLocaleString('en-GB');
  const d=new Date(monday);d.setDate(monday.getDate()+(G.day-1)%5);
  $('clock').textContent=`${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · ${clockStr(D.clock)}`;
  $('strip').innerHTML=`<span><b>${dn}</b> ${clockStr(D.clock)}</span><span>Warnings <b style="color:var(--bad)">${'●'.repeat(D.warn)}${'○'.repeat(Math.max(0,3-D.warn))}</b></span><span>Mailbox <b>${pct}%</b></span><span>Today <b>£${D.pay}</b></span>`;
  const on=D.running&&D.sel!=='policy';
  document.querySelectorAll('[data-a]').forEach(b=>b.disabled=!on);
  $('newMailTxt').textContent=D.running?'New mail':'Clock in';
}
function renderAll(){renderList();renderRead();renderHud()}

/* ---------- actions ---------- */
const DONE={reply:['sent','Reply sent'],archive:['arch','Moved to Archive'],junk:['junk','Moved to Junk Email'],report:['rep','Reported as phishing. Thanks for keeping us safe.']};
const LABEL={reply:'Reply',archive:'Archive',junk:'Junk',report:'Report phishing'};
function act(a){
  if(!D.running||boss||D.sel==='policy')return;
  const i=D.emails.findIndex(x=>x.id===D.sel);if(i<0)return;
  const e=D.emails[i],want=expected(e);
  D.emails.splice(i,1);D.counts[DONE[a][0]]++;D.handled++;
  if(a===want){D.right++;D.pay+=PAY[a];lastWhy=null;lastOk=DONE[a][1]+'.';toast(DONE[a][1])}
  else{D.warn++;D.pay=Math.max(0,D.pay-5);lastOk=null;lastWhy=`That should have been “${LABEL[want]}”. ${e.tpl.why}`}
  const nx=D.emails[Math.min(i,D.emails.length-1)];D.sel=nx?nx.id:'policy';if(nx)nx.read=true;
  renderAll();
  if(D.warn>=3)fail('HR would like a quick word','Three IT warnings in one day. Let’s have a chat about it, then have another go at '+DAYN[(G.day-1)%5]+'.');
}
function select(id){
  D.sel=id==='policy'?'policy':+id;
  if(D.sel==='policy')D.policyUnread=false;else{const e=D.emails.find(x=>x.id===D.sel);if(e)e.read=true}
  lastWhy=null;lastOk=null;renderAll();
  if(window.matchMedia('(max-width:720px)').matches)document.body.classList.add('reading');
}
let toastT;function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,1600)}

/* ---------- day flow ---------- */
function dialog(html){$('dlg').innerHTML=html;$('scrim').hidden=false;const b=$('dlg').querySelector('.btn');b&&b.focus()}
const closeDlg=()=>$('scrim').hidden=true;
function startDay(){closeDlg();D.running=true;renderAll()}
function fail(title,text){
  D.running=false;renderHud();
  dialog(`<h2>${title}</h2><p>${text}</p><div class="acts"><button class="btn" id="dBtn">Try ${DAYN[(G.day-1)%5]} again</button></div>`);
  $('dBtn').onclick=()=>{G.savings=D.startSavings;newDay();D.policyUnread=false;renderAll();startDay()};
}
function endDay(){
  D.running=false;
  const left=D.emails.length,fine=left*3,net=Math.max(0,D.pay-fine);
  G.savings+=net;const dn=DAYN[(G.day-1)%5];
  const acc=D.handled?Math.round(D.right/D.handled*100):0;
  const wasFri=G.day%5===0;
  G.day++;if(wasFri){G.week++;G.day=1}
  G.best=Math.max(G.best,G.savings);save();renderHud();
  dialog(`<h2>${wasFri?'You made it to the weekend':'That’s '+dn+' done'}</h2>
   <p>${wasFri?'Week '+(G.week-1)+' survived. Next week, the mail comes in faster.':'Log off, go home, try not to check your phone.'}</p>
   <table><tr><td>Emails handled</td><td>${D.handled}</td></tr><tr><td>Handled correctly</td><td>${acc}%</td></tr><tr><td>IT warnings</td><td>${D.warn}</td></tr>
   <tr><td>Earned today</td><td>£${D.pay}</td></tr><tr><td>Left in inbox (${left} × £3)</td><td>−£${fine}</td></tr>
   <tr class="tot"><td>Savings</td><td>£${G.savings.toLocaleString('en-GB')}</td></tr></table>
   <div class="acts"><button class="btn" id="dBtn">Clock in for ${DAYN[(G.day-1)%5]}</button></div>`);
  $('dBtn').onclick=()=>{newDay();D.policyUnread=G.day>1;D.sel='policy';renderAll();startDay()};
}

/* ---------- loop ---------- */
let lastT=performance.now();
setInterval(()=>{
  const now=performance.now(),dt=(now-lastT)/1000;lastT=now;
  if(!D||!D.running||boss||document.hidden)return;
  D.clock+=dt*510/DAY_LEN;
  D.acc+=dt;if(D.acc>=D.next){D.acc=0;D.next=gap()*(.7+Math.random()*.6);spawn(false)}
  if(D.emails.length>=FULL){fail('Your mailbox is full','You can’t send or receive email until you make some space. Let’s rewind and try '+DAYN[(G.day-1)%5]+' again.');return}
  if(D.clock>=510){renderHud();endDay();return}
  renderHud();
},250);

/* ---------- decoy ---------- */
const DECOY=[
 ['Priya Shah','priya.shah@'+DOM,'11:42','Re: Spring campaign — final assets','Thanks Fin, these look great. I’ll send them over to Brightwave this afternoon.','<p>Thanks Fin, these look great.</p><p>I’ll send them over to Brightwave this afternoon and let you know if they come back with anything.</p><p>P</p>'],
 ['Mark Delaney','mark.delaney@'+DOM,'10:58','Updated timings for Thursday','Shoot now starts at 10, call time 9:30.'],
 ['Sophie Grant','sophie.grant@brightwave.co.uk','10:21','Re: Round 2 feedback','Perfect, thanks for turning that round so quickly.'],
 ['Facilities','facilities@'+DOM,'09:47','Kitchen closed Friday afternoon','FYI the kitchen will be closed from 2pm Friday.'],
 ['Tom Whitfield','tom.whitfield@'+DOM,'09:15','Deck fonts','Sorted it, was using the wrong weight. Ta!'],
 ['Timesheets','noreply@'+DOM,'08:30','Your timesheet was approved','Your timesheet for last week has been approved.'],
];
function renderDecoy(){
  $('items').innerHTML='<div class="grp">Today</div>'+DECOY.map((d,i)=>`<button class="it${i===0?' sel':''}" data-decoy="1"><span class="av" style="background:${col(d[0])}">${ini(d[0])}</span><span class="fr">${esc(d[0])}</span><span class="tm">${d[2]}</span><span class="sj">${esc(d[3])}</span><span class="pv">${esc(d[4])}</span></button>`).join('');
  const d=DECOY[0];
  $('read').innerHTML=`<button class="back" onclick="document.body.classList.remove('reading')">‹ Inbox</button><div class="rin"><h1 class="subj">${d[3]}</h1>${sender(d[0],d[1],d[2])}<div class="body">${d[5]}</div></div>`;
  $('fInbox').textContent='';$('strip').innerHTML='<span>Focused inbox</span>';
  $('sDay').textContent='';$('sPay').textContent='';$('sWarn').textContent='';$('sStor').textContent='12% full';$('sMeter').firstElementChild.style.width='12%';$('sMeter').classList.remove('hot');$('sSave').textContent='';
  document.querySelectorAll('[data-a]').forEach(b=>b.disabled=false);$('newMailTxt').textContent='New mail';
  const t=new Date();$('clock').textContent=t.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function toggleBoss(){
  boss=!boss;$('toast').hidden=true;
  if(boss){renderDecoy();$('scrim').dataset.was=$('scrim').hidden?'':'1';$('scrim').hidden=true}
  else{renderAll();if($('scrim').dataset.was)$('scrim').hidden=false}
}

/* ---------- input ---------- */
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b&&!boss)select(b.dataset.id);else if(e.target.closest('[data-decoy]')&&window.matchMedia('(max-width:720px)').matches)document.body.classList.add('reading')});
document.querySelector('.ribbon').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a)});
$('newMail').onclick=()=>{if(boss)return;if(!D.running&&$('scrim').hidden)startDay()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();toggleBoss();return}
  if(boss||e.ctrlKey||e.metaKey||e.altKey||!$('scrim').hidden)return;
  const k=e.key.toLowerCase();
  if(k==='r')act('reply');else if(k==='e')act('archive');else if(k==='j')act('junk');else if(k==='p')act('report');
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const ids=['policy',...D.emails.map(x=>x.id)];let i=ids.indexOf(D.sel);
    i=Math.max(0,Math.min(ids.length-1,i+(e.key==='ArrowDown'?1:-1)));select(ids[i]);
    const s=$('items').querySelector('.it.sel');s&&s.scrollIntoView({block:'nearest'});
  }
});

/* ---------- boot ---------- */
newDay();renderAll();
const first=G.day===1&&G.week===1&&G.savings===0;
dialog(`<h2>${first?'Welcome to Studio Ops':'Welcome back'}</h2>
 <p>${first?'Your inbox is about to get busy. Read today’s pinned policy from IT, then keep the inbox under control until 17:30. Handle every email correctly: Reply, Archive, Junk or Report phishing.':'It’s '+DAYN[(G.day-1)%5]+(G.week>1?' of week '+G.week:'')+'. You’ve got £'+G.savings.toLocaleString('en-GB')+' saved. The pinned policy has today’s rules.'}</p>
 <p>Press Esc any time someone walks past.</p>
 <div class="acts">${!first?'<button class="btn sec" id="dReset">Start from Monday</button>':''}<button class="btn" id="dBtn">Clock in</button></div>`);
$('dBtn').onclick=startDay;
const r=$('dReset');if(r)r.onclick=()=>{G={day:1,week:1,savings:0,best:G.best};save();newDay();renderAll();startDay()};
})();
</script>
