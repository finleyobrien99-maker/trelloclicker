<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Q3 Campaign Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --top:#2c3e44; --topText:#e6eef0; --boardBg:#5b7680; --barBg:rgba(0,0,0,.18); --barText:#ffffff;
  --col:#eceff0; --card:#ffffff; --cardHover:#f7f9f9; --text:#1e2a2e; --muted:#5f6d72; --line:#d8dee0;
  --accent:#1f6f8b; --accentSoft:#dcecf2; --good:#3d8a55; --goodSoft:#e1f1e6; --hot:#d2632c; --hotSoft:#fbe7dc; --gold:#b7860b; --goldSoft:#fbf1d3;
  --shadow:0 1px 0 rgba(20,40,45,.18); --shadowUp:0 8px 24px rgba(10,25,30,.28);
  --l1:#4f9a6a; --l2:#d9a63a; --l3:#c75a4a; --l4:#6c6fc2; --l5:#3a8fb3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --top:#141c1f; --topText:#d6e1e4; --boardBg:#243238; --barBg:rgba(0,0,0,.25); --barText:#eef4f5;
    --col:#182023; --card:#263034; --cardHover:#2c383c; --text:#e2e9eb; --muted:#9aaab0; --line:#34404a;
    --accent:#5fb3d0; --accentSoft:#1f3a44; --good:#6cc48a; --goodSoft:#1f3a2a; --hot:#f08a55; --hotSoft:#43291c; --gold:#e8b949; --goldSoft:#3a3015;
    --shadow:0 1px 0 rgba(0,0,0,.4); --shadowUp:0 8px 24px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --top:#141c1f; --topText:#d6e1e4; --boardBg:#243238; --barBg:rgba(0,0,0,.25); --barText:#eef4f5;
  --col:#182023; --card:#263034; --cardHover:#2c383c; --text:#e2e9eb; --muted:#9aaab0; --line:#34404a;
  --accent:#5fb3d0; --accentSoft:#1f3a44; --good:#6cc48a; --goodSoft:#1f3a2a; --hot:#f08a55; --hotSoft:#43291c; --gold:#e8b949; --goldSoft:#3a3015;
  --shadow:0 1px 0 rgba(0,0,0,.4); --shadowUp:0 8px 24px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--boardBg);color:var(--text);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* top nav */
.nav{background:var(--top);color:var(--topText);display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:46px;flex:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em}
.logo i{width:20px;height:20px;border-radius:4px;background:var(--topText);display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.logo i b{background:var(--top);border-radius:1px}
.logo i b:first-child{height:12px}.logo i b:last-child{height:7px}
.nav .menuitem{font-size:13px;opacity:.85}
.nav .me{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#c77d3a;color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}

/* board bar */
.bar{background:var(--barBg);color:var(--barText);display:flex;align-items:center;gap:8px 10px;padding:8px 16px;flex-wrap:wrap;flex:none}
.bar h1{margin:0;font-size:18px;font-weight:700;padding:4px 6px;white-space:nowrap}
.chip{background:rgba(255,255,255,.16);border-radius:4px;padding:5px 10px;font-size:13px;font-weight:500;color:var(--barText);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.chip:hover{background:rgba(255,255,255,.26)}
.chip.on{background:rgba(255,255,255,.92);color:#1e2a2e;font-weight:600}
.chip b{font-weight:700}
.chip.buff{background:var(--hot);color:#fff}
.chip.buff.good{background:#3d8a55}
.chip.buff.gold{background:#b7860b}
.chip.buff.bad{background:#6b6f74}
.stats,.views,.buffs,.shs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.views{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.views .dot{width:7px;height:7px;border-radius:50%;background:#ffcf5a;display:inline-block}
.members{margin-left:auto;display:flex;align-items:center;gap:8px}
.faces{display:flex}
.faces span{width:28px;height:28px;border-radius:50%;border:2px solid var(--boardBg);margin-left:-6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.shs .lbl{font-size:12px;opacity:.85}
.sh{position:relative;height:28px;min-width:28px;border-radius:14px;display:inline-flex;align-items:center;gap:5px;padding:0 9px 0 3px;color:#fff;font-size:11px;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.35);animation:bob 2.6s ease-in-out infinite}
.sh i{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center;font-style:normal;font-size:10px}
.sh:hover{box-shadow:0 0 0 2px #fff}
@keyframes bob{50%{transform:translateY(-2px)}}

/* board */
.board{flex:1;display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:12px 16px 12px;min-height:0}
.list{flex:0 0 272px;max-height:100%;background:var(--col);border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.list.wide{flex-basis:320px}
.list-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px;font-weight:600;gap:8px}
.list-h span{color:var(--muted);font-weight:500;font-size:13px}
.cards{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:10px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;text-align:left;width:100%;display:block;border:1px solid transparent}
.card .labels{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.lbt{font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:2px 6px}
.card .ttl{line-height:1.35}
.card .meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.card .meta .av{margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.card .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.mute{color:var(--muted);font-size:12px;padding:2px 4px;line-height:1.4}
.p{font-size:13px;line-height:1.45;color:var(--text);margin:0}
.p+.p{margin-top:6px}

/* active card */
.active{cursor:pointer;border:1px solid var(--accent);transition:transform .06s}
.active:hover{background:var(--cardHover)}
.active:active{transform:scale(.985)}
.active .ttl{font-size:15px;font-weight:600}
.active.epic{border:2px solid var(--gold);background:linear-gradient(var(--goldSoft),var(--card) 60%)}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.check .track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.check .track i{display:block;height:100%;background:var(--accent);transition:width .12s}
.epic .check .track i{background:var(--gold)}
.hint{font-size:12px;color:var(--accent);margin-top:8px;font-weight:500}
.done-card .ttl{color:var(--muted)}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--good);color:#fff;font-size:10px;margin-right:6px;vertical-align:-3px}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}

/* sprint */
.sprint{border:1px dashed var(--hot);background:var(--hotSoft)}
.sprint.active-s{border-style:solid}
.sprint .row{display:flex;gap:6px;margin-top:8px}
.sprint .row .buy{margin-top:0}
.gauge{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.gauge i{display:block;height:100%;background:var(--hot);transition:width .2s}
.gauge.coffee{height:14px;border-radius:7px}
.gauge.coffee i{background:linear-gradient(90deg,#6f4a2e,#b07a4f)}

/* team + shop */
.seg{display:flex;background:var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.buyrow{display:flex;justify-content:space-between;gap:6px;padding:0 8px 4px}
.hire{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.hire .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.hire .nm{font-weight:600}
.hire .sub{font-size:12px;color:var(--muted);line-height:1.35}
.own{font-size:18px;font-weight:700;color:var(--muted);min-width:24px;text-align:right}
.buy{margin-top:8px;width:100%;border-radius:5px;padding:6px 8px;font-size:13px;font-weight:600;background:var(--accentSoft);color:var(--accent);text-align:center}
.buy:disabled{opacity:.45;cursor:default}
.buy:not(:disabled):hover{background:var(--accent);color:#fff}
.buy.sell{background:var(--hotSoft);color:var(--hot)}
.buy.sell:not(:disabled):hover{background:var(--hot);color:#fff}
.buy.gold{background:var(--goldSoft);color:var(--gold)}
.buy.gold:not(:disabled):hover{background:var(--gold);color:#fff}
.locked{opacity:.55}
.up .ttl{font-weight:600}
.owned-up{opacity:.75}

/* trophies & perks */
.tro{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start}
.tro .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--goldSoft);color:var(--gold)}
.tro.no .ic{background:var(--line);color:var(--muted)}
.tro.no .ttl{color:var(--muted)}
.tro .ttl{font-weight:600;font-size:13px}
.big{font-size:26px;font-weight:700;line-height:1.1}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.srow:last-child{border-bottom:0}
.srow span{color:var(--muted)}
.srow b{font-weight:600;text-align:right}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.save{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--cardHover);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:6px;resize:vertical;word-break:break-all}

/* quick win + floats */
.win{position:fixed;z-index:30;background:var(--goldSoft);color:var(--text);border:1px solid var(--gold);border-radius:8px;padding:8px 12px;box-shadow:var(--shadowUp);max-width:230px;text-align:left;animation:wiggle 1.6s ease-in-out infinite}
.win b{color:var(--gold);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
.float{position:fixed;pointer-events:none;font-weight:700;color:var(--accent);z-index:40;animation:up .7s ease-out forwards;text-shadow:0 1px 0 var(--card)}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.toast{position:fixed;left:16px;bottom:calc(44px + env(safe-area-inset-bottom,0px));background:var(--top);color:var(--topText);padding:10px 14px;border-radius:8px;box-shadow:var(--shadowUp);max-width:min(380px,calc(100vw - 32px));z-index:50;font-size:13px;line-height:1.4}
.toast b{color:#ffcf5a}

/* activity ticker */
.ticker{flex:none;background:var(--barBg);color:var(--barText);font-size:12.5px;padding:7px 16px calc(7px + env(safe-area-inset-bottom,0px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.ticker b{font-weight:600;opacity:.8;margin-right:6px}
.ticker span{transition:opacity .4s}

/* the office dog */
.dog{position:fixed;left:0;bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform 3.2s ease-in-out;user-select:none;-webkit-user-select:none;background:none;border:0;padding:0}
.dog.zoom{transition-duration:.7s}
.dog .b{font-size:42px;line-height:1;display:block;transform:scaleX(var(--dir,1));filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.dog .tag{font-size:11px;font-weight:700;background:var(--card);color:var(--text);border-radius:999px;padding:1px 8px;box-shadow:var(--shadow);white-space:nowrap}
.dog .mood{width:46px;height:4px;border-radius:2px;background:rgba(0,0,0,.2);overflow:hidden}
.dog .mood i{display:block;height:100%;background:#e0567a;transition:width .3s}
.dog .say{position:absolute;bottom:100%;margin-bottom:4px;background:var(--card);color:var(--text);font-size:12px;padding:4px 8px;border-radius:8px;box-shadow:var(--shadowUp);white-space:nowrap;animation:pop .3s ease}
.dog.wag .b{animation:wag .18s ease-in-out 4}
.dog.nap .b{opacity:.85}
@keyframes wag{50%{transform:scaleX(var(--dir,1)) rotate(-8deg) translateY(-3px)}}
.heart{position:fixed;pointer-events:none;z-index:40;color:#e0567a;font-size:18px;animation:up .9s ease-out forwards}

.decoy{display:none}
body.boss .decoy{display:flex}
body.boss .game{display:none!important}

@media (max-width:640px){
  .nav .menuitem{display:none}
  .bar h1{font-size:16px}
  .members .faces{display:none}
  .list,.list.wide{flex-basis:80vw}
  #v-board .list:nth-child(2){order:-2}
  #v-board .list:nth-child(4){order:-1}
  .bar{padding:6px 10px}
  .board{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <nav class="nav">

  </div>
  <div class="board game" id="v-kitchen" hidden></div>
  <div class="board game" id="v-clients" hidden></div>
  <div class="board game" id="v-trophies" hidden></div>
  <div class="board game" id="v-portfolio" hidden></div>
  <div class="board game" id="v-stats" hidden></div>

  <!-- the disguise -->
  <div class="board decoy" id="decoy"></div>

  <div class="ticker game" id="ticker"><b>Activity</b><span id="tickTxt"></span></div>
</div>
<div class="toast" id="toast" hidden></div>

function fmt(n){
  if(!isFinite(n))return '∞';
  const f=FMT;
  if(n<1000) return n<10&&n%1?(Math.floor(n*10)/10).toFixed(1):Math.floor(n).toLocaleString('en-GB');
  if(f==='full'&&n<1e21) return Math.floor(n).toLocaleString('en-GB');
  if(f==='sci') return n.toExponential(2).replace('e+','e');
  const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}
  if(n>=1000) return (n*Math.pow(1000,i+1)).toExponential(2).replace('e+','e');
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i];
}

function recalc(){

  HIRES.forEach(h=>m.hm[h.id]=1);
  let buddy=false;
  for(const id of S.ups){const u=getUp(id);if(!u)continue;const f=u.fx;
    if(f.click)m.click*=f.click;if(f.pct)m.pct+=f.pct;if(f.h)m.hm[f.h]*=f.m;if(f.all)m.all*=f.all;if(f.kit)m.kit.push(f.kit);
    if('fingers' in f){if(f.fingers===0)buddy=true;else m.fmul*=f.fingers}
    if(f.syn)m.syn.push(f.syn);if(f.winFreq)m.winFreq*=f.winFreq;if(f.winDur)m.winDur*=f.winDur;if(f.epic)m.epic*=f.epic;if(f.sprint)m.sprint*=f.sprint;
    if(f.dogPts)m.dogPts*=f.dogPts;if(f.dogHappy)m.dogHappy*=f.dogHappy;if(f.zoomDur)m.zoomDur*=f.zoomDur;if(f.fetch)m.fetch*=f.fetch;
    if(f.cMax)m.cMax+=f.cMax;if(f.cRegen)m.cRegen*=f.cRegen;if(f.shRet)m.shRet+=f.shRet;
  }
  m.fingers=buddy?.1*m.fmul:0;
  if(perk('keyboard'))m.pct+=.02;
  m.awardMult=1+S.awards*(perk('legend')?.015:.01);
  m.perkMult=(perk('cat')?1.25:1)*(perk('dynasty')?1.5:1);
  m.kitMult=m.kit.reduce((a,f)=>a*(1+trophyCount(S)*.04*f),1);
  m.all*=1+.1*flv('floor');m.winFreq*=Math.pow(1.05,flv('snacks'));
  m.legacyMult=1+.1*lgv('rep');m.uni=Math.pow(1+S.universes,1.5);
  const nonIntern=staff()-S.own.intern;
  m.each={};let raw=0;
  for(const h of HIRES){
    let e=h.rate*m.hm[h.id];
    for(const [a,b] of m.syn){if(a===h.id)e*=1+.05*S.own[b];if(b===h.id)e*=1+.001*S.own[a]}
    if(h.id==='intern')e+=m.fingers*nonIntern;
    m.each[h.id]=e;raw+=e*S.own[h.id];
  }
  m.global=m.all*m.kitMult*m.awardMult*m.perkMult*m.legacyMult*m.uni;
  m.base=Math.min(CAP,raw*m.global);
  m.clickBase=Math.min(CAP,(m.click+m.fingers*nonIntern)*m.awardMult*(perk('dynasty')?1.5:1)*(1+.15*flv('chairs'))*m.uni);
  M=m;
}

/* ---------- actions ---------- */
function earn(n){
  if(!(n>0))return;
  S.pts=Math.min(CAP,S.pts+n);S.total=Math.min(CAP,S.total+n);S.allTime=Math.min(CAP,S.allTime+n);
  if(S.total>=CAP&&!S.capWarned){S.capWarned=true;toast('<b>The backlog has collapsed into a singularity.</b> Points can’t go any higher. Head to Portfolio: heat death is the only way forward.')}
}
function floatAt(x,y,txt){
  if(!S.settings.floats)return;
  const s=document.createElement('span');s.className='float';s.textContent=txt;s.style.left=(x-10)+'px';s.style.top=(y-20)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),700);
}
function onClick(e){
  const v=clickVal();earn(v);S.hand+=v;S.handAll+=v;S.clicks++;S.clicksAll++;S.prog++;lastClick=Date.now();
  if(S.prog===1)cardStart=performance.now();
  if(S.sprint&&S.sprint.state==='active'&&S.sprint.type==='ticks')S.sprint.prog++;
  floatAt(e.clientX||innerWidth/2,e.clientY||innerHeight/2,'+'+fmt(v));
  if(S.prog>=need())finishCard(v);else updDoing();
  renderStats();refreshBuy();
}
function finishCard(v){
  const c=S.cur;v=v||clickVal();
  let bonus=v*5;
  if(c.epic){bonus=(v*50+M.base*velBuff()*60)*M.epic;S.epics++;toast(`<b>Epic closed!</b> ${c.t.replace('Epic: ','')} is done. +${fmt(bonus)} points.`)}
  else if(performance.now()-cardStart<1500&&S.prog>=need())unlock('speed');
  earn(bonus);S.cards++;S.cardsAll++;S.sinceEpic++;
  if(S.sprint&&S.sprint.state==='active'&&S.sprint.type==='cards')S.sprint.prog++;
  completeCard(c,'Moved by you');
  S.cur=nextCard();S.prog=0;renderTodo();renderDoing();
}
function completeCard(c,by){S.done.unshift({t:c.t,l:c.l,by});S.done=S.done.slice(0,6);renderDone()}
function hire(id){
  const h=H[id],n=S.settings.amt;
  if(S.settings.mode==='sell'){const k=Math.min(n,S.own[id]);if(!k)return;const g=sellValue(h,k);S.own[id]-=k;S.pts+=g;toast(`Let ${k} ${k===1?h.n:h.pl} go. HR are drafting a very careful email. +${fmt(g)} points.`)}
  else{const c=hireCost(h,n);if(S.pts<c)return;S.pts-=c;S.own[id]+=n}
  recalc();renderTeam();renderUps();renderStats();save();
}
function buyUp(id){
  const u=getUp(id);if(!u)return;const c=upCost(u);if(S.pts<c||S.ups.includes(id))return;
  S.pts-=c;S.ups.push(id);recalc();renderUps(true);renderTeam();renderStats();save();
  toast(`Approved: <b>${u.n}</b>. ${typeof u.d==='function'?u.d():u.d}.`);
}
let toastT;function toast(t){const el=$('toast');el.innerHTML=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4500)}

/* team auto-completes cards (cosmetic) */
let teamAcc=0;
function teamTick(dt){
  const r=vel();if(r<=0)return;
  teamAcc+=r*dt/(10*Math.max(1,M.click)*3);
  if(teamAcc>=1){
    const n=Math.floor(teamAcc);teamAcc-=n;
    const owned=HIRES.filter(h=>S.own[h.id]>0);if(!owned.length)return;const who=owned[Math.floor(Math.random()*owned.length)];
    S.teamCards+=n;completeCard(pickTask(),'Moved by '+who.n+(n>1?` (+${fmt(n-1)} more)`:''));
  }

/* ---------- quick wins ---------- */
let winT;
function schedWin(){clearTimeout(winT);const f=M.winFreq*(perk('luckybreak')?1.25:1);winT=setTimeout(spawnWin,(60+Math.random()*90)*1000/f)}
function spawnWin(at){
  if(boss||document.hidden){if(!at)schedWin();return}
  const b=document.createElement('button');b.className='win';
  b.innerHTML=`<b>Quick win</b>${WINS[Math.floor(Math.random()*WINS.length)]}`;
  b.style.left=(at?Math.min(innerWidth-250,Math.max(16,at.x-40)):Math.max(16,Math.random()*(innerWidth-260)))+'px';
  b.style.top=(at?Math.max(110,at.y-110):Math.max(110,Math.random()*(innerHeight-140)))+'px';
  b.onclick=()=>{b.remove();grabWin()};
  document.body.appendChild(b);setTimeout(()=>b.remove(),13000*(perk('lanyard')?2:1));if(!at)schedWin();
}
function grabWin(){
  S.winsAll++;
  const owned=HIRES.filter(h=>S.own[h.id]>=10),free=availUps().filter(u=>u.cost<=Math.max(S.pts*5,1e4));
  const opts=[['lucky',45],['frenzy',35],['rush',8]];
  if(owned.length)opts.push(['surge',10]);
  if(free.length)opts.push(['free',2]);
  let r=Math.random()*opts.reduce((a,o)=>a+o[1],0),pick='lucky';
  for(const [k,w] of opts){if((r-=w)<0){pick=k;break}}
  const d=durMult();
  if(pick==='lucky'){const g=Math.min(S.pts*.15,M.base*velBuff()*900)+13;earn(g);toast(`<b>Quick win!</b> The client loved it. +${fmt(g)} points.`)}
  else if(pick==='frenzy'){addBuff({id:'frenzy',name:'In the zone ×7',vel:7,cls:'good'},77*d);toast('<b>Quick win!</b> Everyone’s in the zone. Velocity ×7.')}
  else if(pick==='rush'){addBuff({id:'rush',name:'Deadline rush ×777',click:777,cls:'gold'},13*d);toast('<b>Deadline rush!</b> Clicks ×777 for a few seconds. Go go go.')}
  else if(pick==='surge'){const h=owned[Math.floor(Math.random()*owned.length)],m=1+.1*S.own[h.id];addBuff({id:'surge',name:`${h.pl} on fire ×${fmt(m)}`,vel:m,cls:'good'},30*d);toast(`<b>Quick win!</b> Your ${h.pl} are on fire. Velocity ×${fmt(m)}.`)}
  else{const u=free[0];S.ups.push(u.id);recalc();renderUps(true);renderTeam();toast(`<b>Quick win!</b> Finance waved through <b>${u.n}</b> for free.`)}
  checkAch();renderStats();save();
}

/* ---------- stakeholders ---------- */
const shReturn=()=>1.1+M.shRet+(perk('whisper')?.15:0);
function maybeStakeholder(){
  if(S.runTime<300||M.base<=0||S.sh.length>=shMax()||boss)return;
  if(Math.random()<1/120){
    const used=S.sh.map(p=>p.n),pool=PEOPLE.filter(p=>!used.includes(p[0]));const [n,ini,c]=(pool.length?pool:PEOPLE)[Math.floor(Math.random()*(pool.length||PEOPLE.length))];
    S.sh.push({n,ini,c,eaten:0});renderSH(true);renderStats();
    if(S.shPopped<3)toast(`<b>${n}</b> is now watching this board. They’ll siphon a little velocity. Click them to address their feedback — they give back more than they took.`);
  }
}
function popSH(i){
  const p=S.sh[i];if(!p)return;const g=p.eaten*shReturn();S.sh.splice(i,1);earn(g);S.shPopped++;
  toast(`Addressed ${p.n}’s feedback. +${fmt(g)} points (they were sitting on it).`);renderSH(true);renderStats();checkAch();save();
}

/* ---------- sprints ---------- */
const sprintReward=()=>Math.max(M.base*600,clickVal()*150,500)*M.sprint;
function offerSprint(){
  const types=[
    {type:'ticks',title:'Tick off 150 subtasks in 60 seconds',target:150,dur:60},
    {type:'cards',title:'Move 12 cards to Done yourself in 2 minutes',target:12,dur:120},
  ];
  if(M.base>0)types.push({type:'points',title:`Earn ${fmt(Math.max(1000,M.base*135))} points in 90 seconds`,target:Math.max(1000,M.base*135),dur:90});
  const t=types[Math.floor(Math.random()*types.length)];
  S.sprint=Object.assign({state:'offer',offerUntil:Date.now()+60e3,prog:0},t);renderSprint();renderDoing();
  toast(`<b>Sprint proposed:</b> ${t.title}. It’s at the top of the Doing list.`);
}
function sprintProgress(){const sp=S.sprint;return sp.type==='points'?S.total-sp.start:sp.prog}
function startSprint(){const sp=S.sprint;if(!sp||sp.state!=='offer')return;sp.state='active';sp.until=Date.now()+sp.dur*1000;sp.start=S.total;sp.prog=0;renderSprint()}
function endSprint(won){
  if(won){const g=sprintReward();earn(g);S.sprintsWon++;addBuff({id:'glow',name:'Sprint glow ×1.25',vel:1.25,cls:'gold'},300*durMult());toast(`<b>Sprint won!</b> +${fmt(g)} points and velocity ×1.25 for 5 minutes.`)}
  else toast('Sprint missed. It’s going in the next sprint, like everything else.');
  S.sprint=null;nextSprintAt=Date.now()+(8+Math.random()*4)*60e3;renderSprint();renderDoing();checkAch();save();
}
function sprintTick(){
  const now=Date.now(),sp=S.sprint;
  if(!sp){if(now>nextSprintAt&&S.runTime>180&&!boss)offerSprint();return}
  if(sp.state==='offer'&&now>sp.offerUntil){S.sprint=null;nextSprintAt=now+(8+Math.random()*4)*60e3;renderSprint();renderDoing();return}
  if(sp.state==='active'){if(sprintProgress()>=sp.target)endSprint(true);else if(now>sp.until)endSprint(false);else renderSprint()}
  else renderSprint();
}

/* ---------- kitchen ---------- */
function cast(id,discount){
  const s=SPELLS.find(x=>x.id===id);if(!s)return;
  const cost=Math.floor(spellCost(s)*(discount||1));
  if(!discount){if(S.coffee<cost)return;S.coffee-=cost;S.spells++}
  const fail=Math.random()<(discount?.25:s.fail);
  const d=durMult();let msg='';
  if(s.id==='standup'){
    if(fail){const l=Math.min(S.pts*.07,M.base*velBuff()*900);S.pts-=l;msg=`Stand-up overran by an hour. Lost ${fmt(l)} points.`}
    else{const g=Math.min(S.pts*.15,M.base*velBuff()*1800)+M.base*30+50;earn(g);msg=`Stand-up done in five minutes, somehow. +${fmt(g)} points.`}
  }else if(s.id==='biscuits'){finishCard();msg='Biscuits appeared. The card got finished. Nobody knows how.'}
  else if(s.id==='espresso'){addBuff({id:'espresso',name:'Espresso ×10 clicks',click:10,cls:'gold'},30*d);msg='Espresso shot. Clicks ×10 for 30 seconds.'}
  else if(s.id==='breakfast'){
    if(fail){addBuff({id:'kale',name:'Kale ×0.9',vel:.9,cls:'bad'},60);msg='Someone brought kale. Velocity ×0.9 for a minute.'}
    else{addBuff({id:'breakfast',name:'Team breakfast ×1.5',vel:1.5,cls:'good'},120*d);msg='Team breakfast. Velocity ×1.5 for 2 minutes.'}
  }else if(s.id==='flatwhite'){
    if(fail)msg='Spilt the flat white. Nothing happens, except a stain.';
    else{clearTimeout(winT);spawnWin();msg='Flat white ordered. A quick win appeared!'}
  }else if(s.id==='mystery'){
    const others=SPELLS.filter(x=>x.id!=='mystery'&&x.id!=='flatwhite');const o=others[Math.floor(Math.random()*others.length)];
    klog(`Mystery brew turned out to be… ${o.n}.`);cast(o.id,.5);renderView();return;
  }
  klog(msg);toast(msg);checkAch();renderStats();save();if(view==='kitchen')renderKitchen();
}
function klog(m){const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});S.klog.unshift(`<b>${t}</b> · ${m}`);S.klog=S.klog.slice(0,10)}

  S.sh.forEach(x=>earn(x.eaten*shReturn()));
  const rawP=rawAwards();
  const keep=['fam','cl','floors','legacy','awardsBase','universes','crunches','clientsSeen','daily','pets','zoomies','fetches','allTime','cardsAll','clicksAll','handAll','winsAll','awards','clout','perks','resets','spells','shPopped','sprintsWon','epics','escPresses','playTime','firstPlayed','ach','settings','kitchenSeen','klog'];

/* ---------- clients (endless contracts) ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function genOffer(){
  const tier=S.cl.tier,v=Math.max(1,M.base*shFactor()),types=['earn','ticks','cards','hire','wins'];
  if(hasDog(S))types.push('pets');if(S.runTime>300&&M.base>0)types.push('feedback');
  const type=pick(types);let o;
  if(type==='earn'){const dur=180+Math.floor(Math.random()*4)*60,f=1.25+Math.min(tier*.012,1.5);o={title:`Earn ${fmt(v*dur*f)} points`,target:v*dur*f,dur}}
  else if(type==='ticks'){const n=Math.min(400,80+tier*8);o={title:`Tick off ${n} subtasks`,target:n,dur:Math.max(60,Math.round(n/2.2))}}
  else if(type==='cards'){const n=Math.min(40,6+tier);o={title:`Finish ${n} cards yourself`,target:n,dur:n*18}}
  else if(type==='hire'){const vis=teamVisible(),h=vis[Math.max(0,vis.length-1-Math.floor(Math.random()*Math.min(3,vis.length)))],n=Math.min(100,5+Math.floor(tier/2));o={title:`Hire ${n} more ${h.pl}`,target:n,dur:900,hire:h.id}}
  else if(type==='wins'){const n=Math.min(5,1+Math.floor(tier/8));o={title:`Grab ${n} quick win${n>1?'s':''}`,target:n,dur:900+n*300}}
  else if(type==='feedback'){const n=Math.min(6,1+Math.floor(tier/6));o={title:`Address feedback from ${n} stakeholder${n>1?'s':''}`,target:n,dur:1200}}
  else{const n=Math.min(200,20+tier*4);o={title:`Pet ${DOG} ${n} times`,target:n,dur:300}}
  const kudos=1+Math.floor(tier/4)+(type==='earn'||type==='ticks'?1:0)+Math.floor(flv('lounge')/3);
  return Object.assign(o,{type,client:pick(CLIENTS),kudos,id:Math.random().toString(36).slice(2,8)});
}
function conCounter(c){return c.type==='earn'?S.allTime:c.type==='ticks'?S.clicksAll:c.type==='cards'?S.cardsAll:c.type==='hire'?S.own[c.hire]:c.type==='wins'?S.winsAll:c.type==='feedback'?S.shPopped:S.pets}
function conProgress(c){return Math.max(0,conCounter(c)-c.start)}
const conPoints=()=>Math.min(CAP,Math.max(M.base*300,clickVal()*100,1000)*(1+S.cl.tier*.05)*(1+.2*flv('lounge')));
function fillOffers(){while(S.cl.offers.length<3)S.cl.offers.push(genOffer())}
function acceptCon(id){
  if(S.cl.active)return;const i=S.cl.offers.findIndex(o=>o.id===id);if(i<0)return;
  const c=S.cl.offers.splice(i,1)[0];c.start=conCounter(c);c.until=Date.now()+c.dur*1000;S.cl.active=c;fillOffers();renderClients();renderViews(true);save();
  toast(`<b>Contract signed with ${c.client}.</b> ${c.title}. Clock’s ticking.`);
}
function endCon(won){
  const c=S.cl.active;if(!c)return;S.cl.active=null;
  if(won){const g=conPoints();earn(g);S.cl.kudos+=c.kudos;S.cl.kudosAll+=c.kudos;S.cl.done++;S.cl.tier++;S.cl.best=Math.max(S.cl.best,S.cl.tier);
    toast(`<b>${c.client} are thrilled.</b> +${fmt(g)} points and +${c.kudos} kudos. Client tier ${S.cl.tier}: ${clTierName(S.cl.tier)}.`)}
  else{S.cl.failed++;S.cl.tier=Math.max(0,S.cl.tier-1);toast(`${c.client} have taken their business elsewhere. Client tier drops to ${S.cl.tier}.`)}
  checkAch();renderViews(true);if(view==='clients')renderClients();save();
}
function clTick(){
  if(!clientsOpen())return;
  if(!S.clientsSeen){S.clientsSeen=true;fillOffers();S.cl.refreshAt=Date.now()+15*60e3;toast('<b>Clients have found you.</b> Contracts are open in the Clients tab. Complete them for kudos, and spend kudos on office floors that never max out.')}
  const c=S.cl.active,now=Date.now();
  if(c){if(conProgress(c)>=c.target)endCon(true);else if(now>c.until)endCon(false)}
  if(now>S.cl.refreshAt){S.cl.offers=[];fillOffers();S.cl.refreshAt=now+15*60e3;if(view==='clients'&&!ptrDown)renderClients()}
}
function renderClients(){
  const el=$('v-clients');
  if(!clientsOpen()){el.innerHTML=list('Clients','',`<div class="card"><div class="ttl"><b>No clients yet</b></div><p class="p desc">Earn 100K points in one go and clients start calling. Endless contracts, endless rewards.</p></div>`);return}

  const offers=S.cl.offers.map(o=>`<div class="card"><div class="labels"><span class="lbt" style="background:var(--l4)">${o.client}</span><span class="lbt" style="background:var(--gold)">+${o.kudos} kudos</span></div><div class="ttl"><b>${o.title}</b></div><div class="desc">Within ${fmtT(o.dur)}. Pays ${fmt(conPoints())} points.</div><button class="buy" data-con="${o.id}" ${c?'disabled':''}>${c?'Finish your current contract first':'Sign the contract'}</button></div>`).join('')
    +`<div class="card"><div class="desc" style="margin:0">New offers in ${fmtT(Math.max(0,(S.cl.refreshAt-now)/1000))}.</div><button class="buy gold" data-con="reroll" ${S.cl.kudos<1?'disabled':''}>New offers now · 1 kudos</button></div>`;
  const floors=FLOORS.map(f=>{const l=flv(f.id),cost=floorCost(f);return `<div class="card"><div class="ttl"><b>${f.n}</b> <span class="mute">lvl ${l}</span></div><div class="desc">${f.d(l)}</div><button class="buy gold" data-floor="${f.id}" ${S.cl.kudos<cost?'disabled':''}>Build · ${fmt(cost)} kudos</button></div>`}).join('');
  el.innerHTML=list('Client book','',`<div class="card"><div class="big">Tier ${S.cl.tier}</div><p class="p desc">${clTierName(S.cl.tier)}. Every contract you finish moves you up a tier: bigger targets, bigger payouts, forever. Miss one and you drop a tier.</p><div class="srow"><span>Kudos</span><b>${fmt(S.cl.kudos)}</b></div><div class="srow"><span>Contracts done</span><b>${S.cl.done}</b></div><div class="srow"><span>Best tier</span><b>${S.cl.best}</b></div><div class="srow"><span>Walked away / missed</span><b>${S.cl.failed}</b></div></div>`)
    +list('On the go',c?1:0,active)+list('Offers',S.cl.offers.length,offers,true)+list('Office floors','∞',`<div class="card"><p class="p desc">Spend kudos on the building. No level cap, and it all survives rebrands and even the heat death.</p></div>`+floors,true);
}

  }else if(a.dataset.act==='wipe'){
    if(!wipeArmed){wipeArmed=true;renderStatsView();fillSave();setTimeout(()=>{wipeArmed=false;if(view==='stats'){renderStatsView();fillSave()}},4000);return}
    wipeArmed=false;try{localStorage.removeItem('tw-save')}catch(err){}S=fresh();FMT='short';for(let i=0;i<5;i++)S.todo.push(pickTask());S.cur=pickTask();recalc();upKey='';view='board';renderAll();toast('Board archived. Fresh start.');
  }
});

/* ---------- ticker ---------- */
let tickI=0;
function nextTick(){
  if(!S.settings.ticker)return;
  const ok=TICK.filter(([c])=>c(S));const [,t]=ok[Math.floor(Math.random()*ok.length)];
  const sp=$('tickTxt');sp.style.opacity=0;setTimeout(()=>{sp.textContent=t;sp.style.opacity=1},350);
}

/* ---------- loop ---------- */
function renderAll(){renderViews();renderTodo();renderDoing();renderDone();renderTeam();renderUps(true);renderStats();renderBuffs();renderSH();renderSprint();renderView();$('boardName').textContent=boss?'Q3 Campaign Delivery':boardName();$('ticker').hidden=!S.settings.ticker}
FMT=S.settings.fmt;recalc();
const away=(Date.now()-(S.t||Date.now()))/1000;
S.buffs=activeBuffs();
if(S.sprint&&S.sprint.state==='active'&&Date.now()>S.sprint.until)S.sprint=null;
if(S.sprint&&S.sprint.state==='offer')S.sprint=null;
renderAll();
if(away>60&&M.base>0){
  const rate=perk('remote')?.9:.5,cap=perk('remote')?86400:28800,g=M.base*Math.min(away,cap)*rate;earn(g);
  S.coffee=Math.min(coffeeMax(),S.coffee+coffeeRegen()*away);
  unlock('away');toast(`While you were away the team closed <b>${fmt(g)}</b> points.`);renderStats();
}
(function daily(){
  const k=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),now=new Date(),y=new Date(now);y.setDate(now.getDate()-1);
  const t=k(now);if(S.daily.last===t)return;
  S.daily.streak=S.daily.last===k(y)?S.daily.streak+1:1;S.daily.best=Math.max(S.daily.best,S.daily.streak);S.daily.last=t;
  const kd=Math.min(S.daily.streak,7);S.cl.kudos+=kd;S.cl.kudosAll+=kd;
  addBuff({id:'daily',name:'Morning coffee ×2',vel:2,cls:'good'},600);
  setTimeout(()=>toast(`<b>Day ${S.daily.streak} streak!</b> Morning coffee: velocity ×2 for 10 minutes, and +${kd} kudos. Come back tomorrow for more.`),1200);
})();
nextTick();
let last=performance.now(),acc=0,acc2=0,tickAcc=0;
setInterval(()=>{
  const t=performance.now(),dt=Math.min(3600,(t-last)/1000);last=t;
  const v=vel();earn(v*dt);teamTick(dt);
  if(S.sh.length){const each=M.base*velBuff()*.05*S.sh.length*dt;S.sh.forEach(p=>p.eaten+=each)}
  if(kitchenOpen()){if(!S.kitchenSeen){S.kitchenSeen=true;renderViews();toast('<b>The interns found the kitchen.</b> Coffee orders are open. Check the Kitchen tab.')}S.coffee=Math.min(coffeeMax(),S.coffee+coffeeRegen()*dt)}
  if(!document.hidden){S.playTime+=dt;S.runTime+=dt}
  acc+=dt;acc2+=dt;tickAcc+=dt;renderStats();
  if(acc>.5){
    acc=0;refreshBuy();renderUps();if(S.total>0)renderTeamIfNew();renderSH();sprintTick();clTick();
    const before=S.buffs.length;S.buffs=activeBuffs();renderBuffs();if(S.buffs.length!==before)renderStats();
  }
  if(acc2>1){acc2=0;checkAch();maybeStakeholder();renderViews();dogTick();
    if(!ptrDown){if(view==='kitchen')renderKitchen();else if(view==='clients')renderClients();else if(view==='portfolio'&&!rbArmed&&!crArmed)renderPortfolio();else if(view==='stats'&&document.activeElement!==$('saveTxt')&&!wipeArmed){renderStatsView();fillSave()}}}
  if(tickAcc>9){tickAcc=0;nextTick()}
},100);
function renderTeamIfNew(){const vis=teamVisible(),k=vis.length+'|'+(S.settings.mode==='sell')+S.settings.amt;if(k!==teamKey)renderTeam()}
setInterval(save,5000);
document.addEventListener('visibilitychange',save);
schedWin();dogSync();
let first=false;try{first=!localStorage.getItem('tw-seen2');localStorage.setItem('tw-seen2','1')}catch(e){}
if(first&&S.total<1)toast('Click the card in <b>Doing</b> to tick off subtasks, then spend points on hires. Esc hides the lot.');
})();
</script>
